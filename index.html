function updateHUD(force = false) {
  if (!G.player || !G.level) return;
  const p = G.player;
  const hpPct = clamp(p.hp / p.maxHp * 100, 0, 100);
  el.hpFill.style.width = hpPct + '%';
  el.hpFill.classList.toggle('low', p.hp <= CONFIG.player.lowHp && hpPct > CONFIG.player.critHpPct);
  el.hpFill.classList.toggle('crit', hpPct <= CONFIG.player.critHpPct);
  el.hpText.textContent = `${Math.ceil(p.hp)} / ${p.maxHp}`;
  el.brainText.textContent = p.brain;
  const pips = el.dashPips.querySelectorAll('.pip');
  pips.forEach((pip, i) => pip.classList.toggle('on', i < p.dashCharges));
  const chargeProgress = (p.dashCharges >= CONFIG.player.maxDashCharges)
    ? 0
    : clamp(1 - p.dashRegenT / CONFIG.player.dashRegen, 0, 1);
  el.dashMeter.style.width = (chargeProgress * 100) + '%';
  el.levelText.textContent = G.level.night;
  const remain = fmtMeters(p.x - G.level.winX);
  el.objectiveText.textContent = `← 家 ${remain}m`;
  const span = Math.max(1, G.level.startX - G.level.winX);
  const progress = clamp((G.level.startX - p.x) / span, 0, 1);
  el.progressFill.style.width = (progress * 100).toFixed(1) + '%';
  el.progressText.textContent = Math.round(progress * 100) + '%';
  el.miLevel.textContent = G.level.night;
  el.miObjective.textContent = `← 家 ${remain}m`;
  el.miProgress.style.width = (progress * 100).toFixed(1) + '%';
  const canHeal = G.state === 'playing' && p.hp < p.maxHp && p.brain >= CONFIG.player.healCost;
  const canStock = G.state === 'playing' && p.brain >= CONFIG.player.stockCost && p.dashCharges < CONFIG.player.maxDashCharges;
  el.healBtn.disabled = !canHeal;
  el.stockBtn.disabled = !canStock;
  el.pauseBtn.disabled = !(G.state === 'playing' || G.state === 'paused');
  el.stage.classList.toggle('low', G.state === 'playing' && p.hp > 0 && p.hp <= CONFIG.player.lowHp);
}

function showToast(text, kind = '') {
  el.toast.textContent = text;
  el.toast.className = kind ? kind : '';
  el.toast.classList.add('show');
  clearTimeout(G.toastTimer);
  G.toastTimer = setTimeout(() => el.toast.classList.remove('show'), CONFIG.ui.toastDuration);
}

function nearPlant() {
  if (!G.player || G.state !== 'playing') return null;
  let best = null;
  let bestD = Infinity;
  for (const pl of G.plants) {
    if (pl.dead) continue;
    const d = G.player.x - pl.x;
    if (d >= 0 && d <= CONFIG.ui.promptRange && d < bestD) {
      best = pl;
      bestD = d;
    }
  }
  return best;
}

function updateCoach(force = false) {
  if (!G.player || G.state !== 'playing') {
    el.coach.classList.remove('show');
    G.lastCoach = '';
    return;
  }
  const p = G.player;
  let text = '';
  if (p.biting) {
    const pct = p.biteTarget ? Math.round(clamp(1 - p.biteTarget.hp / p.biteTarget.maxHp, 0, 1) * 100) : 0;
    text = `<b>啃咬中 ${pct}%</b> · 松口停止 · 蹲下可减少中弹`;
  } else {
    const near = nearPlant();
    if (near) {
      const keyName = document.body.classList.contains('touch') ? '「啃」' : '空格';
      text = `按住 <b>${keyName}</b> 啃咬 <span style="opacity:.55">·</span> 蹲下更安全但更慢`;
    } else if (p.hp <= CONFIG.player.lowHp && p.brain > 0) {
      text = `生命偏低 · <b>1</b> 愈合 / <b>2</b> 蓄冲`;
    } else if (p.slowT > 0) {
      text = `<b>冻缓</b> · 移动和啃咬变慢，先找掩体`;
    } else if (G.levelTime < CONFIG.ui.coachMinTime) {
      text = G.level.intro;
    }
  }
  if (text !== G.lastCoach || force) {
    G.lastCoach = text;
    if (text) {
      el.coach.innerHTML = text;
      el.coach.classList.add('show');
    } else {
      el.coach.classList.remove('show');
    }
  }
}

function flashDamage() {
  el.flash.classList.remove('hit');
  void el.flash.offsetWidth;
  el.flash.classList.add('hit');
}

/* ============================================================
   脑能动作
   ============================================================ */
function tryHeal() {
  if (G.state !== 'playing') return;
  const p = G.player;
  if (p.hp >= p.maxHp) { showToast('生命是满的，脑子先留着。', 'bad'); return; }
  if (p.brain < CONFIG.player.healCost) { showToast('脑能不够。去啃一株植物。', 'bad'); return; }
  p.brain -= CONFIG.player.healCost;
  p.hp = Math.min(p.maxHp, p.hp + CONFIG.player.healAmount);
  G.shake = Math.max(G.shake, CONFIG.fx.healShake);
  addText(p.x, GROUND - 120, `+${CONFIG.player.healAmount}`, '#b9f36b', 18);
  burst(p.x, GROUND - 58, 16, ['#b9f36b', '#e9ffcf', '#ff9fba'], 1.2);
  Sound.heal();
  showToast('愈合 +' + CONFIG.player.healAmount, 'good');
  updateHUD(true);
}

function tryStockDash() {
  if (G.state !== 'playing') return;
  const p = G.player;
  if (p.dashCharges >= CONFIG.player.maxDashCharges) { showToast('冲刺已经满了。', 'bad'); return; }
  if (p.brain < CONFIG.player.stockCost) { showToast('脑能不够。去啃一株植物。', 'bad'); return; }
  p.brain -= CONFIG.player.stockCost;
  p.dashCharges = Math.min(CONFIG.player.maxDashCharges, p.dashCharges + 1);
  p.dashRegenT = p.dashCharges < CONFIG.player.maxDashCharges ? CONFIG.player.dashRegen : 0;
  addText(p.x, GROUND - 120, '冲刺 +1', '#ffc15b', 16);
  burst(p.x, GROUND - 50, 12, ['#ffc15b', '#fff2b1'], 1);
  Sound.tone(660, 0.18, 'triangle', 0.12, 180);
  showToast('储能完成：多一次冲刺', 'good');
  updateHUD(true);
}

function requestDash() {
  if (G.state !== 'playing') return;
  const p = G.player;
  if (!p || p.biting || p.dead) return;
  if (p.dashCharges <= 0 || p.dashT > 0) return;
  p.dashCharges -= 1;
  if (p.dashCharges < CONFIG.player.maxDashCharges && p.dashRegenT <= 0) p.dashRegenT = CONFIG.player.dashRegen;
  p.dashT = CONFIG.player.dashDuration;
  p.dashDir = input.left ? -1 : input.right ? 1 : -1;
  p.facing = p.dashDir;
  p.crouchAmt = 0;
  p.invuln = Math.max(p.invuln, CONFIG.player.dashInvuln);
  G.shake = Math.max(G.shake, CONFIG.fx.dashShake);
  Sound.dash();
  for (let i = 0; i < 7; i++) {
    spawnParticle(p.x - p.dashDir * 14, GROUND - rand(8, 60), 'dust', {
      vx: -p.dashDir * rand(60, 150), vy: rand(-30, 20), life: rand(0.25, 0.5), size: rand(3, 8), color: '#8da27d'
    });
  }
  updateHUD(true);
}

/* ============================================================
   粒子 / 浮动文字
   ============================================================ */
function spawnParticle(x, y, kind, opts = {}) {
  if (G.particles.length >= CONFIG.fx.maxParticles) G.particles.shift();
  G.particles.push({
    x, y, kind,
    vx: opts.vx || 0,
    vy: opts.vy || 0,
    ax: opts.ax || 0,
    ay: opts.ay !== undefined ? opts.ay : 900,
    life: opts.life || 0.6,
    maxLife: opts.life || 0.6,
    size: opts.size || 4,
    color: opts.color || '#b9f36b',
    rot: opts.rot || 0,
    rotV: opts.rotV || 0,
    drag: opts.drag !== undefined ? opts.drag : 0.4
  });
}
function burst(x, y, n, colors, power = 1, kind = 'circle') {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const sp = rand(30, 170) * power;
    spawnParticle(x + rand(-8, 8), y + rand(-8, 8), kind, {
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - rand(20, 90) * power,
      ay: kind === 'spark' ? 120 : 680,
      life: rand(0.35, 0.8),
      size: rand(2.5, 7) * Math.min(1.5, power),
      color: pick(colors),
      rot: rand(0, TAU),
      rotV: rand(-9, 9),
      drag: 0.8
    });
  }
}
function addText(x, y, text, color = '#eaffd5', size = 16) {
  G.texts.push({ x, y, text, color, size, life: 1.1, maxLife: 1.1, vy: -28 });
}

function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.vy += p.ay * dt;
    p.vx *= (1 - p.drag * dt);
    p.vy *= (1 - p.drag * 0.25 * dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.rotV * dt;
    if (p.kind === 'dust' && p.y > GROUND - 2) { p.y = GROUND - 2; p.vy *= -0.2; }
  }
}
function updateTexts(dt) {
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i];
    t.life -= dt;
    if (t.life <= 0) { G.texts.splice(i, 1); continue; }
    t.y += t.vy * dt;
    t.vy *= (1 - 2.4 * dt);
  }
}

function updateAmbient(dt) {
  const th = G.level ? G.level.theme : CONFIG.levels[0].theme;
  for (const a of G.ambient) {
    if (th.ambient === 'firefly') {
      a.drift += dt * (0.7 + a.z);
      a.x += Math.cos(a.drift) * 7 * dt;
      a.y += Math.sin(a.drift * 1.4) * 6 * dt - 2 * dt;
      if (a.y < 70) a.y = H - 80;
      if (a.y > H - 70) a.y = 80;
      if (a.x < -20) a.x = W + 20;
      if (a.x > W + 20) a.x = -20;
    } else if (th.ambient === 'snow') {
      a.y += a.v * a.z * dt;
      a.x += Math.sin(G.time * 0.7 + a.drift) * 9 * dt;
      if (a.y > H + 10) { a.y = -10; a.x = Math.random() * W; }
      if (a.x < -15) a.x = W + 15;
      if (a.x > W + 15) a.x = -15;
    } else {
      a.y += a.v * a.z * dt;
      a.x += (12 + Math.sin(G.time + a.drift) * 9) * dt;
      a.rot += dt * (0.7 + a.z);
      if (a.y > H + 12) { a.y = -12; a.x = Math.random() * W; }
      if (a.x > W + 20) { a.x = -20; a.y = Math.random() * H * 0.7; }
    }
  }
}

/* ============================================================
   主更新
   ============================================================ */
function update(dt) {
  if (G.state === 'paused') return;

  G.time += dt;
  G.shake = Math.max(0, G.shake - CONFIG.camera.shakeDecay * dt);
  updateAmbient(dt);
  updateParticles(dt);
  updateTexts(dt);

  if (G.state === 'playing') {
    G.levelTime += dt;
    updatePlayer(dt);
    if (G.state === 'playing') updatePlants(dt);
    if (G.state === 'playing') updateBullets(dt);
    updateCovers(dt);
    updateCamera(dt);
    updateCoach();
    if (G.state === 'playing') {
      G.hudClock += dt;
      if (G.hudClock >= CONFIG.ui.hudRefresh) {
        G.hudClock = 0;
        updateHUD();
      }
    }
  } else {
    if (G.state === 'dead') G.player.deathT += dt;
    updateCovers(dt);
    updateCamera(dt);
    G.hudClock += dt;
    if (G.hudClock >= CONFIG.ui.hudRefresh) {
      G.hudClock = 0;
      updateHUD();
    }
  }
}

function updateCamera(dt) {
  if (!G.level || !G.player) return;
  const maxCam = Math.max(0, G.level.width - W);
  let target = clamp(G.player.x - W * CONFIG.camera.lookAhead, 0, maxCam);
  if (G.state === 'title') target = clamp(G.level.startX - W * CONFIG.camera.lookAhead, 0, maxCam);
  G.camX = damp(G.camX, target, CONFIG.camera.smooth, dt);
  if (Math.abs(G.camX - target) < 0.2) G.camX = target;
}

/* ============================================================
   玩家更新
   ============================================================ */
function updatePlayer(dt) {
  const p = G.player;
  const c = CONFIG.player;
  p.invuln = Math.max(0, p.invuln - dt);
  p.hitFlash = Math.max(0, p.hitFlash - dt);
  p.slowT = Math.max(0, p.slowT - dt);

  const wantCrouch = input.crouch && p.dashT <= 0;
  p.crouchAmt = damp(p.crouchAmt, wantCrouch ? 1 : 0, 16, dt);

  // 冲刺充能
  if (p.dashCharges < c.maxDashCharges) {
    p.dashRegenT -= dt;
    if (p.dashRegenT <= 0) {
      p.dashCharges += 1;
      p.dashRegenT = p.dashCharges < c.maxDashCharges ? c.dashRegen : 0;
      addText(p.x, GROUND - 116, '冲刺 +1', '#ffc15b', 13);
      Sound.tone(540, 0.09, 'triangle', 0.06, 80);
      updateHUD(true);
    }
  } else {
    p.dashRegenT = 0;
  }

  if (p.dashT > 0) {
    // 冲刺：锁定方向、短暂无敌、不能啃咬
    p.dashT = Math.max(0, p.dashT - dt);
    p.biting = false;
    p.biteTarget = null;
    p.crouchAmt = damp(p.crouchAmt, 0, 22, dt);
    const blocked = movePlayerX(p.dashDir * c.dashSpeed * dt);
    p.walkPhase += dt * 22;
    p.dashTrailT -= dt;
    if (p.dashTrailT <= 0) {
      p.dashTrailT = 0.035;
      spawnParticle(p.x - p.dashDir * 18, GROUND - rand(24, 78), 'dust', {
        vx: -p.dashDir * rand(40, 120), vy: rand(-20, 25),
        life: rand(0.18, 0.36), size: rand(3, 7), color: '#a6b58f', ay: 200
      });
    }
    if (blocked) {
      p.dashT = 0;
      G.shake = Math.max(G.shake, 3.5);
      burst(p.x - 14, GROUND - 40, 6, ['#7d8b6a', '#b0b995'], 0.7, 'dust');
    }
    if (p.dashT <= 0) p.vx = p.dashDir * c.speed * 0.35;
    p.moving = true;
  } else {
    const target = findBiteTarget();
    if (target && input.bite) {
      // 啃咬：不能移动，自动贴近植物
      p.biting = true;
      p.biteTarget = target;
      p.facing = -1;
      p.vx = 0;
      p.moving = false;
      p.x = damp(p.x, target.x + c.biteContact, c.biteSnap, dt);
      p.chompPhase += dt * (p.crouchAmt > c.crouchThreshold ? 9.5 : 13.5);
      bitePlant(target, dt);
    } else {
      p.biting = false;
      p.biteTarget = null;
      let dir = 0;
      if (input.left) dir -= 1;
      if (input.right) dir += 1;
      if (dir !== 0) p.facing = dir;
      let speed = p.crouchAmt > c.crouchThreshold ? c.crouchSpeed : c.speed;
      if (p.slowT > 0) speed *= c.slowFactor;
      const desired = dir * speed;
      if (dir === 0) {
        const decel = c.friction * dt;
        if (Math.abs(p.vx) <= decel) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * decel;
      } else {
        p.vx += clamp(desired - p.vx, -c.accel * dt, c.accel * dt);
      }
      const blocked = movePlayerX(p.vx * dt);
      if (blocked) p.vx = 0;
      p.moving = Math.abs(p.vx) > 8;
      if (p.moving) {
        p.walkPhase += Math.abs(p.vx) * dt * 0.04 + dt * 0.6;
        p.stepT -= dt;
        if (p.stepT <= 0) {
          p.stepT = p.crouchAmt > c.crouchThreshold ? 0.34 : 0.24;
          spawnParticle(p.x + rand(-8, 8), GROUND - 2, 'dust', {
            vx: rand(-18, 18), vy: rand(-24, -5), ay: 120,
            life: rand(0.18, 0.35), size: rand(2, 5), color: '#95a17f', drag: 0.8
          });
        }
      } else {
        p.stepT = 0;
      }
    }
  }

  if (p.x <= G.level.winX && G.state === 'playing') winLevel();
}

function movePlayerX(dx) {
  const p = G.player;
  const c = CONFIG.player;
  let nx = p.x + dx;
  nx = clamp(nx, CONFIG.world.leftPad, G.level.width - CONFIG.world.walkPad);
  let blocked = false;

  if (dx < 0) {
    let blocker = null;
    for (const pl of G.plants) {
      if (pl.dead) continue;
      if (pl.x < p.x - 0.01 && (!blocker || pl.x > blocker.x)) blocker = pl;
    }
    if (blocker) {
      const bound = blocker.x + c.biteContact;
      if (nx < bound) {
        nx = bound;
        blocked = true;
      }
    }
  }

  p.x = nx;
  return blocked;
}

function findBiteTarget() {
  if (!G.player || G.state !== 'playing') return null;
  const p = G.player;
  const c = CONFIG.player;
  let best = null;
  let bestD = Infinity;
  for (const pl of G.plants) {
    if (pl.dead) continue;
    const d = p.x - pl.x;
    if (d >= c.biteContact - c.biteApproachSlack && d <= c.biteRange && d < bestD) {
      best = pl;
      bestD = d;
    }
  }
  return best;
}

function bitePlant(plant, dt) {
  const p = G.player;
  const c = CONFIG.player;
  const mult = p.crouchAmt > c.crouchThreshold ? c.crouchBiteFactor : 1;
  plant.hp -= c.biteDps * mult * dt;
  plant.hitFlash = Math.max(plant.hitFlash, 0.06);
  plant.wobble = Math.max(plant.wobble, 0.08);
  plant.barT = 1.6;
  p.biteSfxT -= dt;
  G.shake = Math.max(G.shake, CONFIG.fx.biteShake);

  if (p.biteSfxT <= 0) {
    p.biteSfxT = c.biteSfxInterval;
    Sound.bite();
    const px = plant.x + rand(-8, 14);
    const py = GROUND - rand(24, 74);
    for (let i = 0; i < 4; i++) {
      spawnParticle(px, py, 'crumb', {
        vx: rand(-70, 40), vy: rand(-90, -15), ay: 760,
        life: rand(0.3, 0.62), size: rand(2, 5),
        color: pick(['#8ecb64', '#5f9e45', '#c8ec8a']), rot: rand(0, TAU), rotV: rand(-12, 12)
      });
    }
    G.shake = Math.max(G.shake, CONFIG.fx.biteShake);
  }

  if (plant.hp <= 0) eatPlant(plant);
}

function eatPlant(plant) {
  if (plant.dead) return;
  plant.hp = 0;
  plant.dead = true;
  plant.deathT = 0;
  const p = G.player;
  p.biting = false;
  p.biteTarget = null;
  p.brain += plant.def.brain;
  p.brainsEarned += plant.def.brain;
  p.plantsEaten += 1;
  G.shake = Math.max(G.shake, CONFIG.fx.eatShake);
  addText(plant.x + 8, GROUND - plant.def.artHeight - 10, `+${plant.def.brain} 脑能`, '#ffb4c9', 18);
  addText(plant.x - 8, GROUND - plant.def.artHeight - 34, `吃掉${plant.def.label}`, '#eaffd5', 13);
  burst(plant.x, GROUND - 48, 22, ['#7fbd5c', '#b9f36b', '#ff9fba', '#ffe6a6'], 1.35);
  for (let i = 0; i < 5; i++) {
    spawnParticle(plant.x + rand(-20, 20), GROUND - rand(30, 90), 'brain', {
      vx: rand(-50, 50), vy: rand(-120, -40), ay: 420,
      life: rand(0.5, 0.9), size: rand(3, 5), color: pick(['#ff9fba', '#ffc1d0']),
      rot: rand(0, TAU), rotV: rand(-7, 7)
    });
  }
  Sound.eat();
  showToast(`吃掉${plant.def.label}！获得 ${plant.def.brain} 点脑能`, 'good');
  updateHUD(true);
}

/* ============================================================
   植物更新
   ============================================================ */
function updatePlants(dt) {
  const p = G.player;
  for (const pl of G.plants) {
    if (pl.dead) { pl.deathT += dt; continue; }
    pl.hitFlash = Math.max(0, pl.hitFlash - dt);
    pl.wobble = damp(pl.wobble, 0, 9, dt);
    pl.recoil = damp(pl.recoil, 0, 9, dt);
    pl.firePulse = Math.max(0, pl.firePulse - dt * 4);
    pl.barT = Math.max(0, pl.barT - dt);
    if (!pl.def.attack) continue;

    const inFront = p.x > pl.x && p.x - pl.x <= pl.def.aggro && G.levelTime >= CONFIG.world.levelGrace && p.hp > 0;
    if (pl.state === 'windup') {
      pl.timer -= dt;
      pl.telegraph = clamp(1 - pl.timer / pl.def.windup, 0, 1);
      if (pl.timer <= 0) {
        firePlant(pl);
        pl.state = 'cooldown';
        pl.timer = pl.def.cooldown;
        pl.telegraph = 0;
      }
    } else if (pl.state === 'cooldown') {
      pl.timer -= dt;
      if (pl.timer <= 0) pl.state = 'idle';
    } else {
      pl.telegraph = 0;
      if (inFront) {
        pl.state = 'windup';
        pl.timer = pl.def.windup;
        pl.telegraph = 0;
        if (p.x - pl.x < 340) Sound.charge(pl.type);
      }
    }
  }
}

function firePlant(pl) {
  if (pl.dead) return;
  const def = pl.def;
  const baseY = GROUND - def.muzzleHeight + rand(-def.spread, def.spread);
  G.bullets.push({
    x: pl.x + def.muzzleX,
    y: baseY,
    baseY,
    vx: def.bulletSpeed,
    vy: 0,
    r: def.bulletRadius,
    damage: def.damage,
    type: pl.type,
    slow: !!def.slow,
    age: 0,
    wobble: rand(0, TAU),
    dead: false
  });
  pl.recoil = 1;
  pl.firePulse = 1;
  G.shake = Math.max(G.shake, 0.6);
  Sound.shoot(pl.type);
  const mx = pl.x + def.muzzleX + 6;
  const my = baseY;
  for (let i = 0; i < 5; i++) {
    spawnParticle(mx, my, 'spark', {
      vx: rand(20, 90), vy: rand(-35, 35), ay: 80,
      life: rand(0.12, 0.3), size: rand(1.5, 3.6),
      color: pl.type === 'frost' ? pick(['#bff5ff', '#8be8ff', '#e8ffff']) : pick(['#baf279', '#e6ffb0', '#6ea94b']),
      drag: 1
    });
  }
}

/* ============================================================
   子弹 / 掩体 / 受伤
   ============================================================ */
function circleRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w);
  const ny = clamp(cy, y, y + h);
  const dx = cx - nx;
  const dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

function updateBullets(dt) {
  const p = G.player;
  const c = CONFIG.player;
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.age += dt;
    b.x += b.vx * dt;
    b.y = b.baseY + Math.sin(b.age * 9 + b.wobble) * CONFIG.bullets.wobble;

    if (b.age > CONFIG.bullets.maxAge || b.x < -60 || b.x > G.level.width + 80) {
      G.bullets.splice(i, 1);
      continue;
    }

    let coverHit = null;
    for (const cov of G.covers) {
      if (cov.dead) continue;
      const left = cov.x - cov.w / 2;
      const right = cov.x + cov.w / 2;
      if (b.x + b.r >= left && b.x - b.r <= right && b.y >= GROUND - cov.h - 4 && b.y <= GROUND + 4) {
        coverHit = cov;
        break;
      }
    }
    if (coverHit) {
      damageCover(coverHit, b.damage, b.x, b.y, b.type);
      G.bullets.splice(i, 1);
      continue;
    }

    if (p && p.hp > 0 && p.invuln <= 0 && p.dashT <= 0) {
      const bodyH = c.standHeight - (c.standHeight - c.crouchHeight) * p.crouchAmt;
      const top = GROUND - bodyH;
      if (circleRect(b.x, b.y, b.r, p.x - c.bodyWidth / 2, top, c.bodyWidth, bodyH)) {
        hurtPlayer(b.damage, b);
        G.bullets.splice(i, 1);
        continue;
      }
    }
  }
}

function damageCover(cov, dmg, x, y, type) {
  cov.hp -= dmg;
  cov.hitFlash = 0.14;
  cov.wobble = 0.2;
  G.shake = Math.max(G.shake, CONFIG.covers.hitShake);
  const colors = cov.type === 'sandbag'
    ? ['#9a9462', '#c2b982', '#6d6b45']
    : cov.type === 'bin'
      ? ['#8e9ba0', '#c6d1d2', '#59666b']
      : ['#a1794a', '#c99a5e', '#6f5132'];
  for (let i = 0; i < 6; i++) {
    spawnParticle(x, y, 'shard', {
      vx: rand(-35, 80), vy: rand(-80, 10), ay: 800,
      life: rand(0.3, 0.7), size: rand(2, 4.5), color: pick(colors),
      rot: rand(0, TAU), rotV: rand(-10, 10)
    });
  }
  if (cov.hp <= 0 && !cov.dead) {
    cov.dead = true;
    cov.hp = 0;
    G.shake = Math.max(G.shake, 7);
    Sound.coverBreak();
    showToast('掩体碎了！', 'bad');
    addText(cov.x, GROUND - cov.h - 12, '掩体碎了', '#ff9c8f', 14);
    burst(cov.x, GROUND - cov.h * 0.55, 28, colors, 1.45, 'shard');
  }
}

function hurtPlayer(dmg, bullet) {
  const p = G.player;
  if (!p || p.invuln > 0 || p.dashT > 0 || p.hp <= 0) return;
  p.hp = Math.max(0, p.hp - dmg);
  p.invuln = CONFIG.player.hurtInvuln;
  p.hitFlash = CONFIG.player.hitFlashTime;
  p.vx = Math.max(p.vx, 24);
  G.shake = Math.max(G.shake, CONFIG.bullets.damageShake);
  G.run.hits += 1;
  flashDamage();
  Sound.hurt();
  addText(p.x, GROUND - 118, `-${dmg}`, '#ff7f6f', 18);
  burst(p.x, GROUND - 58, 13, ['#ff7f6f', '#ffb3a8', '#9dc471'], 1.05);
  if (bullet.slow) {
    p.slowT = CONFIG.player.slowDuration;
    addText(p.x, GROUND - 140, '冻缓!', '#8be8ff', 14);
    for (let i = 0; i < 10; i++) {
      spawnParticle(p.x + rand(-20, 20), GROUND - rand(20, 90), 'spark', {
        vx: rand(-40, 40), vy: rand(-45, 20), ay: 160,
        life: rand(0.35, 0.7), size: rand(1.5, 3.5), color: pick(['#bff5ff', '#8be8ff', '#e8ffff'])
      });
    }
  }
  if (p.hp <= 0) die();
  updateHUD(true);
}

function updateCovers(dt) {
  for (const c of G.covers) {
    c.hitFlash = Math.max(0, c.hitFlash - dt);
    c.wobble = damp(c.wobble, 0, 10, dt);
  }
}

/* ============================================================
   胜负
   ============================================================ */
function winLevel() {
  if (G.state !== 'playing') return;
  const p = G.player;
  p.vx = 0;
  p.biting = false;
  p.biteTarget = null;
  p.facing = -1;
  G.bullets = [];
  G.run.levels[G.levelIndex] = {
    time: G.levelTime,
    hp: p.hp,
    brains: p.brainsEarned,
    plants: p.plantsEaten
  };
  G.run.brains += p.brainsEarned;
  G.run.plants += p.plantsEaten;
  const final = G.levelIndex >= CONFIG.levels.length - 1;
  G.state = final ? 'victory' : 'clear';
  resetInput();
  Sound.win();
  G.shake = Math.max(G.shake, 4);
  for (let i = 0; i < 18; i++) {
    spawnParticle(p.x + rand(-30, 30), GROUND - rand(40, 130), 'heart', {
      vx: rand(-55, 55), vy: rand(-160, -60), ay: 220,
      life: rand(0.7, 1.3), size: rand(3, 6), color: pick(['#ff9fba', '#ffc15b', '#b9f36b']),
      rot: rand(0, TAU), rotV: rand(-4, 4)
    });
  }
  updateHUD(true);
  el.coach.classList.remove('show');
  showToast(final ? '你摸到家门了！' : '后院清空，继续向左。', 'good');
  clearTimers();
  G.overlayTimer = setTimeout(() => {
    if (G.state === 'victory') renderVictory();
    else if (G.state === 'clear') renderClear();
  }, CONFIG.ui.clearOverlayDelay * 1000);
}

function die() {
  if (G.state !== 'playing') return;
  const p = G.player;
  p.hp = 0;
  p.dead = true;
  p.deathT = 0;
  p.biting = false;
  p.biteTarget = null;
  G.bullets = [];
  G.state = 'dead';
  resetInput();
  Sound.lose();
  G.shake = Math.max(G.shake, 11);
  burst(p.x, GROUND - 54, 26, ['#9dc471', '#6b8f4e', '#ff7f6f', '#ffc15b'], 1.4);
  for (let i = 0; i < 6; i++) {
    spawnParticle(p.x + rand(-18, 18), GROUND - rand(30, 90), 'brain', {
      vx: rand(-70, 70), vy: rand(-170, -60), ay: 520,
      life: rand(0.6, 1.1), size: rand(3.5, 5.5), color: pick(['#ff9fba', '#ffc1d0']),
      rot: rand(0, TAU), rotV: rand(-8, 8)
    });
  }
  updateHUD(true);
  el.coach.classList.remove('show');
  showToast('你散架了……', 'bad');
  clearTimers();
  G.overlayTimer = setTimeout(() => {
    if (G.state === 'dead') renderDead();
  }, CONFIG.ui.deathOverlayDelay * 1000);
}

/* ============================================================
   绘制：背景
   ============================================================ */
function withShake(parallax, fn) {
  ctx.save();
  ctx.translate(-G.camX * parallax + G.shakeX, G.shakeY);
  fn();
  ctx.restore();
}

function drawSky(t, th) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND + 90);
  g.addColorStop(0, th.skyTop);
  g.addColorStop(0.55, th.skyMid);
  g.addColorStop(1, th.skyLow);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 地平线雾光
  const hg = ctx.createRadialGradient(W * 0.48, GROUND - 30, 10, W * 0.48, GROUND - 30, W * 0.82);
  hg.addColorStop(0, th.haze);
  hg.addColorStop(0.55, alpha(th.haze, 0.05));
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, GROUND + 100);

  // 星空
  for (const s of STARS) {
    let x = ((s.x * W - G.camX * 0.014) % W + W) % W;
    const y = s.y * GROUND;
    const tw = 0.68 + 0.32 * Math.sin(t * s.tw + s.x * 14);
    ctx.globalAlpha = s.a * tw * (1 - clamp(y / GROUND, 0, 1) * 0.45);
    circle(x, y, s.r, th.star);
    if (s.r > 1.55 && tw > 0.8) {
      ctx.globalAlpha *= 0.42;
      line(x - 4, y, x + 4, y, th.star, 0.8);
      line(x, y - 4, x, y + 4, th.star, 0.8);
    }
  }
  ctx.globalAlpha = 1;

  // 月亮
  const mx = W * 0.78 - G.camX * 0.016;
  const my = 104;
  const moonGlow = ctx.createRadialGradient(mx, my, 8, mx, my, 130);
  moonGlow.addColorStop(0, alpha(th.moon, 0.28));
  moonGlow.addColorStop(0.4, alpha(th.moon, 0.09));
  moonGlow.addColorStop(1, alpha(th.moon, 0));
  ctx.fillStyle = moonGlow;
  ctx.fillRect(mx - 140, my - 140, 280, 280);
  circle(mx, my, 43, alpha(th.moon, 0.95));
  ctx.globalAlpha = 0.2;
  circle(mx - 14, my - 13, 8, '#6f6346');
  circle(mx + 15, my + 9, 11, '#6f6346');
  circle(mx + 3, my - 23, 4, '#6f6346');
  circle(mx - 20, my + 17, 4.5, '#6f6346');
  ctx.globalAlpha = 1;
  ctx.strokeStyle = alpha(th.moon, 0.2);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(mx, my, 47, 0, TAU); ctx.stroke();

  // 云
  for (const c of CLOUDS) {
    const x = ((c.x * (W + 260) + t * c.v * 900 - G.camX * 0.03) % (W + 260)) - 130;
    const y = c.y * 280 + 38;
    ctx.globalAlpha = c.a;
    ctx.fillStyle = th.haze;
    ctx.beginPath();
    ctx.ellipse(x, y, 88 * c.s, 17 * c.s, 0, 0, TAU);
    ctx.ellipse(x + 50 * c.s, y - 9 * c.s, 56 * c.s, 14 * c.s, 0, 0, TAU);
    ctx.ellipse(x - 55 * c.s, y + 4, 48 * c.s, 12 * c.s, 0, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 霜夜的极光
  if (th.ambient === 'snow') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.06;
    for (let b = 0; b < 3; b++) {
      const grad = ctx.createLinearGradient(0, 60 + b * 42, 0, 210 + b * 25);
      grad.addColorStop(0, 'rgba(139,232,255,0)');
      grad.addColorStop(0.45, th.accent);
      grad.addColorStop(1, 'rgba(139,232,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 160 + b * 20);
      for (let x = 0; x <= W; x += 40) {
        ctx.lineTo(x, 140 + b * 22 + Math.sin(x * 0.008 + t * 0.25 + b) * 18);
      }
      ctx.lineTo(W, 280);
      ctx.lineTo(0, 280);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawHills(th) {
  withShake(0.1, () => {
    const grad = ctx.createLinearGradient(0, GROUND - 190, 0, GROUND);
    grad.addColorStop(0, th.hillFar);
    grad.addColorStop(1, th.hillMid);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-200, GROUND + 20);
    for (let x = -200; x <= W + 260; x += 36) {
      ctx.lineTo(x, GROUND - 92 + Math.sin(x * 0.006 + 1.2) * 28 + Math.sin(x * 0.013) * 10);
    }
    ctx.lineTo(W + 260, GROUND + 20);
    ctx.closePath();
    ctx.fill();
  });

  withShake(0.18, () => {
    // 远处的树
    ctx.fillStyle = th.hillNear;
    for (let i = 0; i < 15; i++) {
      const x = -120 + i * 120 + Math.sin(i * 9.1) * 24;
      const h = 52 + (i % 4) * 13;
      ctx.beginPath();
      ctx.moveTo(x - 25, GROUND - 30);
      ctx.lineTo(x, GROUND - 30 - h);
      ctx.lineTo(x + 25, GROUND - 30);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = th.hillNear;
    ctx.beginPath();
    ctx.moveTo(-200, GROUND);
    for (let x = -200; x <= W + 220; x += 28) {
      ctx.lineTo(x, GROUND - 48 + Math.sin(x * 0.01 + 4) * 18);
    }
    ctx.lineTo(W + 220, GROUND + 30);
    ctx.lineTo(-200, GROUND + 30);
    ctx.closePath();
    ctx.fill();
  });
}

function drawBackHouses(th) {
  withShake(0.4, () => {
    const start = Math.floor((G.camX * 0.4 - 180) / 360) * 360;
    for (let x = start; x < G.camX * 0.4 + W + 240; x += 360) {
      const i = Math.round(x / 360);
      const seed = ((i * 37) % 11 + 11) % 11;
      const bw = 150 + seed * 4;
      const bh = 62 + (seed % 4) * 10;
      const bx = x + (seed % 3) * 23;
      const by = GROUND - bh - 32;
      ctx.fillStyle = th.houseFar;
      ctx.fillRect(bx, by, bw, bh + 34);
      ctx.beginPath();
      ctx.moveTo(bx - 12, by + 2);
      ctx.lineTo(bx + bw * 0.5, by - 40 - seed * 2);
      ctx.lineTo(bx + bw + 12, by + 2);
      ctx.closePath();
      ctx.fillStyle = th.houseNear;
      ctx.fill();
      // 窗户
      const lit = (seed + i * 3) % 4 !== 0;
      ctx.fillStyle = lit ? alpha(th.accent, 0.38) : 'rgba(4,10,10,.6)';
      for (let w = 0; w < 3; w++) {
        ctx.fillRect(bx + 20 + w * 40, by + 22 + (w % 2) * 21, 12, 10);
      }
      // 烟囱
      ctx.fillStyle = th.houseFar;
      ctx.fillRect(bx + bw * 0.68, by - 54, 14, 28);
    }
  });
}

function drawFence(th) {
  withShake(0.68, () => {
    ctx.fillStyle = th.fence;
    const start = Math.floor((G.camX * 0.68 - 60) / 29) * 29;
    for (let x = start; x < G.camX * 0.68 + W + 80; x += 29) {
      const h = 52 + ((Math.round(x / 29) * 17) % 7);
      ctx.beginPath();
      ctx.moveTo(x, GROUND - 8);
      ctx.lineTo(x, GROUND - h);
      ctx.lineTo(x + 5, GROUND - h - 8);
      ctx.lineTo(x + 10, GROUND - h);
      ctx.lineTo(x + 10, GROUND - 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillRect(start, GROUND - 45, G.camX * 0.68 + W + 100 - start, 6);
    ctx.fillRect(start, GROUND - 22, G.camX * 0.68 + W + 100 - start, 5);
  });
}

function drawGround(t, th) {
  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, th.groundTop);
  g.addColorStop(0.32, th.ground);
  g.addColorStop(1, th.groundDeep);
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND - 2, W, H - GROUND + 2);

  // 草地边缘
  ctx.fillStyle = th.grassDark;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 16) {
    ctx.lineTo(x, GROUND - 3 - Math.sin(x * 0.06 + G.camX * 0.03) * 2);
  }
  ctx.lineTo(W, GROUND + 8);
  ctx.lineTo(0, GROUND + 8);
  ctx.closePath();
  ctx.fill();

  // 草坪纹理 & 草叶
  withShake(1, () => {
    const start = Math.floor((G.camX - 60) / 31) * 31;
    for (let x = start; x < G.camX + W + 60; x += 31) {
      const n = Math.abs(Math.sin(x * 0.137 + 2.2));
      const h = 6 + n * 12;
      const sway = Math.sin(t * 2.2 + x * 0.03) * 2.2;
      ctx.strokeStyle = x % 3 === 0 ? th.grass : th.grassDark;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x, GROUND + 5);
      ctx.quadraticCurveTo(x + sway, GROUND - h * 0.5, x + sway * 1.8, GROUND - h);
      ctx.stroke();
      if (n > 0.78) {
        ctx.beginPath();
        ctx.moveTo(x + 3, GROUND + 5);
        ctx.quadraticCurveTo(x + 6 + sway, GROUND - h * 0.4, x + 10 + sway, GROUND - h * 0.8);
        ctx.stroke();
      }
    }

    // 土路碎石
    for (let x = Math.floor((G.camX - 100) / 220) * 220; x < G.camX + W + 100; x += 220) {
      ctx.globalAlpha = 0.24;
      ellipse(x + 30, GROUND + 32, 28, 7, '#cab880');
      ctx.globalAlpha = 0.18;
      ellipse(x + 85, GROUND + 62, 18, 5, '#e6d8a8');
      ctx.globalAlpha = 1;
    }

    // 小石子与蘑菇
    for (let x = start; x < G.camX + W + 60; x += 93) {
      const y = GROUND + 20 + ((Math.abs(Math.sin(x)) * 34) | 0);
      ctx.globalAlpha = 0.4;
      ellipse(x, y, 5, 2.3, '#c4b78d');
      ctx.globalAlpha = 1;
      if (Math.abs(Math.sin(x * 0.31)) > 0.86) {
        const mx = x + 19, my = y + 13;
        ctx.fillStyle = '#d4c6a1';
        ctx.fillRect(mx - 1.5, my - 5, 3, 6);
        ctx.beginPath();
        ctx.ellipse(mx, my - 6, 6, 3.8, 0, Math.PI, TAU);
        ctx.fillStyle = '#c47563';
        ctx.fill();
        circle(mx - 2, my - 7.5, 1, '#f3dfc0');
      }
    }
  });

  // 前景暗草
  withShake(1.08, () => {
    ctx.strokeStyle = alpha('#06130d', 0.8);
    ctx.lineWidth = 3;
    for (let x = Math.floor((G.camX * 1.08 - 40) / 42) * 42; x < G.camX * 1.08 + W + 50; x += 42) {
      const h = 12 + Math.abs(Math.sin(x * 0.21)) * 22;
      const sway = Math.sin(t * 1.7 + x * 0.02) * 4;
      ctx.beginPath();
      ctx.moveTo(x, H);
      ctx.quadraticCurveTo(x + sway, H - h * 0.5, x + sway * 2, H - h);
      ctx.stroke();
    }
  });
}

/* ============================================================
   绘制：房子和掩体
   ============================================================ */
function drawHouse(t, lv) {
  const th = lv.theme;
  const wall = th.season === 'autumn' ? '#48302f' : th.season === 'winter' ? '#263b45' : '#3b3a31';
  const wallDark = th.season === 'autumn' ? '#2c1b1d' : th.season === 'winter' ? '#15262f' : '#24251f';
  const roof = th.season === 'autumn' ? '#24151c' : th.season === 'winter' ? '#0f202b' : '#1b211e';
  const trim = th.season === 'autumn' ? '#8d5f3a' : th.season === 'winter' ? '#5c7a84' : '#7d7654';
  const warm = '#ffc76d';

  // 从门里漏出来的光
  const glow = ctx.createRadialGradient(211, GROUND - 52, 4, 211, GROUND - 40, 156);
  glow.addColorStop(0, 'rgba(255,196,104,.25)');
  glow.addColorStop(0.45, 'rgba(255,180,84,.1)');
  glow.addColorStop(1, 'rgba(255,170,80,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(30, GROUND - 200, 370, 215);

  ctx.save();
  ctx.translate(0, 0);

  // 地基
  ctx.globalAlpha = 0.5;
  ellipse(170, GROUND + 4, 162, 18, '#020806');
  ctx.globalAlpha = 1;
  ctx.fillStyle = wallDark;
  ctx.fillRect(26, GROUND - 16, 280, 18);

  // 墙体
  ctx.fillStyle = wall;
  ctx.fillRect(26, 226, 280, GROUND - 226);
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(26, 226, 280, GROUND - 226);
  ctx.fillStyle = alpha(wallDark, 0.55);
  ctx.fillRect(26, 226, 280, 8);

  // 墙板竖纹
  ctx.strokeStyle = 'rgba(0,0,0,.18)';
  ctx.lineWidth = 1;
  for (let x = 42; x < 300; x += 24) {
    ctx.beginPath(); ctx.moveTo(x, 240); ctx.lineTo(x, GROUND - 16); ctx.stroke();
  }

  // 屋顶
  ctx.beginPath();
  ctx.moveTo(6, 238);
  ctx.lineTo(166, 124);
  ctx.lineTo(328, 238);
  ctx.closePath();
  ctx.fillStyle = roof;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.strokeStyle = alpha(trim, 0.28);
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(35 + i * 16, 235 - i * 18);
    ctx.lineTo(295 - i * 16, 235 - i * 18);
    ctx.stroke();
  }
  ctx.fillStyle = roof;
  ctx.fillRect(8, 230, 318, 14);
  ctx.fillStyle = alpha('#000', 0.25);
  ctx.fillRect(8, 241, 318, 4);

  // 烟囱 + 烟
  ctx.fillStyle = wallDark;
  ctx.fillRect(256, 154, 33, 78);
  ctx.fillStyle = trim;
  ctx.fillRect(252, 148, 41, 11);
  for (let i = 0; i < 4; i++) {
    const ph = (t * 0.16 + i * 0.27) % 1;
    ctx.globalAlpha = 0.16 * (1 - ph);
    circle(273 + Math.sin(ph * 6 + i) * 10, 145 - ph * 72, 8 + ph * 16, '#cbd8c4');
  }
  ctx.globalAlpha = 1;

  // 左窗
  const wx = 66, wy = 270, ww = 66, wh = 58;
  ctx.fillStyle = warm;
  ctx.fillRect(wx, wy, ww, wh);
  const wg = ctx.createRadialGradient(wx + ww / 2, wy + wh / 2, 4, wx + ww / 2, wy + wh / 2, 68);
  wg.addColorStop(0, 'rgba(255,216,132,.25)');
  wg.addColorStop(1, 'rgba(255,216,132,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(wx - 32, wy - 32, ww + 64, wh + 64);
  ctx.strokeStyle = trim;
  ctx.lineWidth = 5;
  ctx.strokeRect(wx, wy, ww, wh);
  ctx.beginPath();
  ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh);
  ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2);
  ctx.stroke();
  ctx.fillStyle = alpha('#5b3a2b', 0.55);
  ctx.beginPath();
  ctx.moveTo(wx, wy);
  ctx.quadraticCurveTo(wx + 19, wy + 25, wx, wy + 45);
  ctx.lineTo(wx, wy);
  ctx.fill();
  ctx.fillStyle = warm;
  ctx.globalAlpha = 0.7;
  ctx.fillRect(wx + 7, wy + 8, 8, 10);
  ctx.globalAlpha = 1;

  // 右窗
  const rx = 253, ry = 262, rw = 53, rh = 66;
  ctx.fillStyle = warm;
  ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = trim;
  ctx.lineWidth = 5;
  ctx.strokeRect(rx, ry, rw, rh);
  ctx.beginPath();
  ctx.moveTo(rx + rw / 2, ry); ctx.lineTo(rx + rw / 2, ry + rh);
  ctx.moveTo(rx, ry + rh / 2); ctx.lineTo(rx + rw, ry + rh / 2);
  ctx.stroke();
  ctx.fillStyle = alpha('#5b3a2b', 0.55);
  ctx.beginPath();
  ctx.moveTo(rx + rw, ry);
  ctx.quadraticCurveTo(rx + 31, ry + 26, rx + rw, ry + 52);
  ctx.lineTo(rx + rw, ry);
  ctx.fill();

  // 门
  const dx = 174, dy = 336, dw = 72, dh = GROUND - dy;
  ctx.fillStyle = alpha('#1a100b', 0.75);
  ctx.fillRect(dx - 6, dy - 5, dw + 12, dh + 5);
  ctx.fillStyle = alpha(warm, 0.92);
  ctx.fillRect(dx, dy, dw, dh);
  ctx.fillStyle = alpha('#6d3d24', 0.64);
  ctx.fillRect(dx + 4, dy + 4, dw - 8, dh - 4);
  ctx.fillStyle = warm;
  ctx.fillRect(dx + 10, dy + 10, dw - 20, dh - 10);
  ctx.strokeStyle = trim;
  ctx.lineWidth = 4;
  ctx.strokeRect(dx, dy, dw, dh);
  ctx.beginPath();
  ctx.moveTo(dx + dw / 2, dy); ctx.lineTo(dx + dw / 2, dy + dh);
  ctx.stroke();
  circle(dx + 15, dy + 57, 2.6, '#5d3a25');
  // 门玻璃里的一点暖光
  ctx.globalAlpha = 0.32;
  ellipse(dx + 46, dy + 31, 13, 22, '#fff3c8');
  ctx.globalAlpha = 1;

  // 门牌
  ctx.fillStyle = '#e9dcb4';
  ctx.strokeStyle = '#3a2a1f';
  ctx.lineWidth = 2;
  roundPath(dx + 19, dy - 41, 34, 25, 5);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#40301f';
  ctx.font = '800 14px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('家', dx + 36, dy - 28);

  // 门廊灯
  const lampX = dx + dw / 2, lampY = dy - 20;
  const lampGlow = ctx.createRadialGradient(lampX, lampY, 2, lampX, lampY, 46);
  lampGlow.addColorStop(0, 'rgba(255,213,118,.6)');
  lampGlow.addColorStop(1, 'rgba(255,213,118,0)');
  ctx.fillStyle = lampGlow;
  ctx.fillRect(lampX - 50, lampY - 50, 100, 100);
  ctx.fillStyle = '#ffda85';
  circle(lampX, lampY, 5.5, '#ffda85');
  ctx.strokeStyle = '#423223';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(lampX, lampY - 13); ctx.lineTo(lampX, lampY - 22);
  ctx.stroke();
  ctx.fillStyle = '#3a2d21';
  ctx.fillRect(lampX - 8, lampY - 24, 16, 3);

  // 门垫
  ctx.fillStyle = '#6b4b32';
  ctx.fillRect(dx + 3, GROUND - 9, dw - 6, 8);
  ctx.fillStyle = '#b58a55';
  ctx.font = '700 6px "Microsoft YaHei", sans-serif';
  ctx.fillText('回 家 吧', dx + dw / 2, GROUND - 5);

  // 灌木
  const bush = th.season === 'autumn' ? '#5a4328' : th.season === 'winter' ? '#2a4448' : '#2d4d31';
  const bushHi = th.season === 'autumn' ? '#7a5a31' : th.season === 'winter' ? '#3c5f61' : '#436640';
  for (const [bx, by, br] of [[48, GROUND - 8, 24], [78, GROUND - 2, 18], [296, GROUND - 3, 20], [318, GROUND - 12, 24]]) {
    ctx.fillStyle = bush;
    circle(bx, by - br * 0.6, br, bush);
    ctx.fillStyle = bushHi;
    circle(bx - br * 0.25, by - br * 0.9, br * 0.55, bushHi);
  }

  // 台阶
  ctx.fillStyle = '#4b4435';
  ctx.fillRect(dx - 12, GROUND - 4, dw + 24, 8);
  ctx.fillStyle = '#635a45';
  ctx.fillRect(dx - 6, GROUND - 1, dw + 12, 5);

  // 季节装饰
  if (th.season === 'winter') {
    ctx.fillStyle = 'rgba(226,247,255,.7)';
    ctx.beginPath();
    ctx.moveTo(9, 237);
    ctx.lineTo(166, 124);
    ctx.lineTo(323, 237);
    ctx.lineTo(305, 238);
    ctx.lineTo(166, 137);
    ctx.lineTo(27, 238);
    ctx.closePath();
    ctx.fill();
    for (let i = 0; i < 6; i++) {
      ctx.globalAlpha = 0.55;
      circle(70 + i * 40, 235 + (i % 2) * 4, 7 + (i % 3) * 3, '#e2f7ff');
    }
    ctx.globalAlpha = 1;
  } else if (th.season === 'autumn') {
    for (let i = 0; i < 7; i++) {
      const lx = 36 + i * 39 + Math.sin(t * 0.4 + i) * 5;
      const ly = 239 + (i % 2) * 3;
      ctx.fillStyle = i % 2 ? '#aa6338' : '#7b492b';
      ctx.beginPath();
      ctx.ellipse(lx, ly, 5, 2.4, 0.5 + i, 0, TAU);
      ctx.fill();
    }
  }

  // 窗边的猫？——一小团剪影，增加家的感觉
  ctx.fillStyle = 'rgba(45,28,18,.65)';
  ctx.beginPath();
  ctx.ellipse(283, 313, 10, 14, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(283, 300, 7, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(278, 296); ctx.lineTo(276, 289); ctx.lineTo(282, 294);
  ctx.moveTo(288, 296); ctx.lineTo(290, 289); ctx.lineTo(284, 294);
  ctx.fill();

  // 家的微光
  if (G.state !== 'title') {
    ctx.globalAlpha = 0.55 + Math.sin(t * 3.2) * 0.18;
    const beacon = ctx.createLinearGradient(0, GROUND - 80, 0, GROUND);
    beacon.addColorStop(0, 'rgba(255,214,131,0)');
    beacon.addColorStop(1, 'rgba(255,214,131,.22)');
    ctx.fillStyle = beacon;
    ctx.fillRect(dx + 8, GROUND - 90, dw - 16, 90);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawCover(cov, t) {
  if (cov.dead) return;
  const dmg = clamp(1 - cov.hp / cov.maxHp, 0, 1);
  const x = cov.x - cov.w / 2;
  const y = GROUND - cov.h;
  const w = cov.w;
  const h = cov.h;
  const rot = Math.sin(t * 26 + cov.seed) * cov.wobble;
  ctx.save();
  ctx.translate(cov.x, GROUND);
  ctx.rotate(rot);
  ctx.translate(-cov.x, -GROUND);
  if (cov.hitFlash > 0) ctx.filter = 'brightness(1.8)';

  ctx.globalAlpha = 0.42;
  ellipse(cov.x, GROUND + 1, w * 0.64, 8, '#020706');
  ctx.globalAlpha = 1;

  if (cov.type === 'crate') {
    const grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, '#a67b4b');
    grad.addColorStop(0.55, '#7d5732');
    grad.addColorStop(1, '#5a3d23');
    fillRound(x, y, w, h, 6, grad);
    ctx.strokeStyle = '#352317';
    ctx.lineWidth = 3;
    roundPath(x, y, w, h, 6);
    ctx.stroke();
    // 木板
    ctx.strokeStyle = 'rgba(48,30,17,.72)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) line(x + 4, y + i * h / 4, x + w - 4, y + i * h / 4, 'rgba(48,30,17,.65)', 2);
    // 斜撑
    ctx.strokeStyle = '#b18451';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(x + 7, y + h - 10);
    ctx.lineTo(x + w - 8, y + 11);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(50,31,18,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 10, y + h - 12);
    ctx.lineTo(x + w - 6, y + 10);
    ctx.stroke();
    // 金属角
    ctx.fillStyle = '#7d8b82';
    for (const [cx, cy] of [[x + 3, y + 3], [x + w - 15, y + 3], [x + 3, y + h - 12], [x + w - 15, y + h - 12]]) {
      ctx.fillRect(cx, cy, 12, 9);
    }
    // 涂鸦贴纸
    ctx.fillStyle = 'rgba(185,243,107,.5)';
    ctx.beginPath();
    ctx.ellipse(x + 25, y + 32, 8, 11, -0.5, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(35,56,27,.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 22, y + 41); ctx.lineTo(x + 28, y + 24);
    ctx.stroke();

    // 裂纹
    if (dmg > 0.18) {
      ctx.strokeStyle = `rgba(37,22,12,${0.45 + dmg * 0.35})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.62, y + 8);
      ctx.lineTo(x + w * 0.52, y + 28);
      ctx.lineTo(x + w * 0.67, y + 44);
      ctx.lineTo(x + w * 0.58, y + 64);
      ctx.stroke();
    }
    if (dmg > 0.55) {
      ctx.fillStyle = 'rgba(24,14,8,.75)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.72, y + h * 0.55, 10, 13, 0.3, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + w * 0.35, y + h * 0.8);
      ctx.lineTo(x + w * 0.45, y + h * 0.62);
      ctx.lineTo(x + w * 0.52, y + h * 0.8);
      ctx.closePath();
      ctx.fill();
    }
  } else if (cov.type === 'bin') {
    const grad = ctx.createLinearGradient(x, y, x + w, y);
    grad.addColorStop(0, '#6f7e80');
    grad.addColorStop(0.28, '#b7c4c3');
    grad.addColorStop(0.65, '#7b898b');
    grad.addColorStop(1, '#4d5a5c');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x + 8, y + 12);
    ctx.lineTo(x + w - 8, y + 12);
    ctx.lineTo(x + w - 3, GROUND - 2);
    ctx.lineTo(x + 3, GROUND - 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2b3839';
    ctx.lineWidth = 3;
    ctx.stroke();
    // 桶盖
    ctx.fillStyle = '#879596';
    roundPath(x - 2, y + 2, w + 4, 16, 8);
    ctx.fill();
    ctx.strokeStyle = '#2b3839';
    ctx.stroke();
    ctx.fillStyle = '#c0cecc';
    ctx.fillRect(x + w * 0.36, y - 2, w * 0.28, 5);
    // 桶箍
    ctx.strokeStyle = 'rgba(40,55,56,.65)';
    ctx.lineWidth = 3;
    for (let i = 1; i < 3; i++) {
      line(x + 5, y + 16 + i * 27, x + w - 5, y + 16 + i * 27, 'rgba(40,55,56,.65)', 3);
    }
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(x + 14, y + 22, 8, h - 34);
    // 凹陷
    if (dmg > 0.2) {
      ctx.fillStyle = 'rgba(35,47,48,.45)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.7, y + h * 0.45, 9, 12, 0.2, 0, TAU);
      ctx.fill();
    }
    if (dmg > 0.6) {
      ctx.strokeStyle = 'rgba(25,34,35,.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.42, y + 18);
      ctx.lineTo(x + w * 0.55, y + 47);
      ctx.lineTo(x + w * 0.46, y + 72);
      ctx.stroke();
    }
  } else {
    // 沙袋
    const rows = 3;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < 2; c++) {
        const bw = w / 2 - 2;
        const bh = h / rows - 3;
        const bx = x + c * (w / 2) + (r % 2 ? 3 : 0);
        const by = y + r * (h / rows) + 2;
        if (dmg > 0.55 && r === 1 && c === 1) continue;
        const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
        grad.addColorStop(0, '#9d9862');
        grad.addColorStop(0.55, '#777747');
        grad.addColorStop(1, '#545632');
        fillRound(bx, by, bw, bh, 11, grad);
        ctx.strokeStyle = '#35391f';
        ctx.lineWidth = 2.4;
        roundPath(bx, by, bw, bh, 11);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(224,216,162,.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + 7, by + bh * 0.3);
        ctx.quadraticCurveTo(bx + bw * 0.52, by + bh * 0.2, bx + bw - 7, by + bh * 0.35);
        ctx.stroke();
        // 缝线
        ctx.fillStyle = 'rgba(43,44,28,.6)';
        ctx.fillRect(bx + bw / 2 - 1, by + 3, 2, bh - 6);
      }
    }
    // 苔藓
    ctx.fillStyle = 'rgba(87,114,51,.55)';
    circle(x + 12, y + h - 8, 5, 'rgba(87,114,51,.55)');
    circle(x + 17, y + h - 12, 3, 'rgba(112,143,62,.5)');
    // 破损
    if (dmg > 0.25) {
      ctx.strokeStyle = 'rgba(47,43,24,.65)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.65, y + 16);
      ctx.lineTo(x + w * 0.57, y + 34);
      ctx.lineTo(x + w * 0.7, y + 48);
      ctx.stroke();
      ctx.fillStyle = 'rgba(191,174,111,.45)';
      for (let i = 0; i < 3; i++) circle(x + w * 0.55 + i * 4, y + 55 + i * 8, 2.2, 'rgba(191,174,111,.45)');
    }
  }

  ctx.filter = 'none';
  ctx.restore();
}

/* ============================================================
   绘制：植物
   ============================================================ */
function drawWindupBeams(t) {
  for (const pl of G.plants) {
    if (pl.dead || pl.state !== 'windup' || !pl.def.attack) continue;
    const y = GROUND - pl.def.muzzleHeight;
    const start = pl.x + pl.def.muzzleX;
    const len = 205;
    const a = 0.16 + pl.telegraph * 0.24;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = pl.type === 'frost' ? '#9eeeff' : '#d4ff8a';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([5, 8]);
    ctx.lineDashOffset = -t * 28;
    ctx.beginPath();
    ctx.moveTo(start, y);
    ctx.lineTo(start + len, y);
    ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < 3; i++) {
      const ax = start + 45 + i * 52;
      ctx.globalAlpha = a * (0.5 + i * 0.2);
      ctx.beginPath();
      ctx.moveTo(ax + 5, y - 5);
      ctx.lineTo(ax, y);
      ctx.lineTo(ax + 5, y + 5);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawPlant(pl, t) {
  if (pl.dead && pl.deathT > 0.55) return;
  const def = pl.def;
  const isDead = pl.dead;
  const deathK = isDead ? clamp(1 - pl.deathT / 0.55, 0, 1) : 1;
  const sway = Math.sin(t * 1.5 + pl.seed) * 0.012;
  const wob = Math.sin(t * 24 + pl.seed) * pl.wobble * 0.5;

  ctx.save();
  ctx.translate(pl.x, GROUND);
  ctx.globalAlpha = isDead ? deathK : 1;
  if (isDead) {
    ctx.translate(0, (1 - deathK) * 14);
    ctx.scale(1 + (1 - deathK) * 0.2, deathK);
  }
  ctx.rotate(sway + wob);
  if (pl.hitFlash > 0) ctx.filter = 'brightness(1.85)';

  // 阴影
  ctx.globalAlpha *= 1;
  ellipse(0, 2, 32, 7, 'rgba(2,8,5,.38)');

  if (pl.type === 'pea') drawPeaPlant(pl, t);
  else if (pl.type === 'frost') drawFrostPlant(pl, t);
  else drawWallPlant(pl, t);

  ctx.filter = 'none';
  ctx.restore();

  // 血条 / 啃咬进度
  if (!isDead && pl.barT > 0) {
    const pct = clamp(1 - pl.hp / pl.maxHp, 0, 1);
    const bw = 76, bh = 8;
    const bx = pl.x - bw / 2;
    const by = GROUND - def.artHeight - 28;
    ctx.save();
    ctx.globalAlpha = clamp(pl.barT * 2, 0, 1);
    fillRound(bx - 2, by - 13, bw + 4, bh + 15, 6, 'rgba(6,16,12,.82)');
    ctx.strokeStyle = 'rgba(185,243,107,.24)';
    ctx.lineWidth = 1;
    roundPath(bx - 2, by - 13, bw + 4, bh + 15, 6);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(bx, by, bw, bh);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#ff9fba');
    grad.addColorStop(0.55, '#ffc15b');
    grad.addColorStop(1, '#b9f36b');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, bw * pct, bh);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    for (let i = 1; i < 4; i++) ctx.fillRect(bx + bw * i / 4, by, 1, bh);
    ctx.fillStyle = '#dff7cb';
    ctx.font = '800 9px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('啃咬', bx + 1, by - 6);
    ctx.fillStyle = '#ffc15b';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(pct * 100) + '%', bx + bw - 1, by - 6);
    ctx.restore();
  }

  // 攻击前摇提示
  if (!isDead && pl.state === 'windup') {
    const y = GROUND - def.artHeight - (pl.barT > 0 ? 56 : 24);
    const pulse = 1 + Math.sin(t * 30) * 0.06;
    ctx.save();
    ctx.translate(pl.x, y);
    ctx.scale(pulse, pulse);
    ctx.globalAlpha = 0.78 + pl.telegraph * 0.22;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
    g.addColorStop(0, 'rgba(255,193,91,.36)');
    g.addColorStop(1, 'rgba(255,193,91,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffc15b';
    ctx.strokeStyle = '#2a1d0c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -11); ctx.lineTo(10, 6); ctx.lineTo(-10, 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2a1d0c';
    ctx.font = '900 11px "Arial Black", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, -2);
    // 蓄力环
    ctx.strokeStyle = alpha(def.type === 'frost' ? '#8be8ff' : '#b9f36b', 0.7);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, 0, 17, -Math.PI / 2, -Math.PI / 2 + pl.telegraph * TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawPeaPlant(pl, t) {
  const def = pl.def;
  const inflate = pl.state === 'windup' ? 1 + 0.07 * Math.sin(t * 22) * pl.telegraph : 1;
  const recoil = pl.recoil * 6;

  // 茎与叶
  ctx.strokeStyle = '#356c34';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-2, -30, 1, -50);
  ctx.stroke();
  ctx.strokeStyle = '#5d9a45';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.quadraticCurveTo(-3, -32, 1, -48);
  ctx.stroke();

  path('#477f36', '#203c21', 3, () => {
    ctx.moveTo(-2, -2);
    ctx.bezierCurveTo(-20, -10, -36, -2, -44, 4);
    ctx.bezierCurveTo(-28, 12, -10, 10, -2, 4);
    ctx.closePath();
  });
  path('#5d9a45', '#203c21', 3, () => {
    ctx.moveTo(4, -4);
    ctx.bezierCurveTo(20, -14, 36, -8, 45, -2);
    ctx.bezierCurveTo(28, 8, 12, 9, 4, 4);
    ctx.closePath();
  });
  line(-18, -3, -35, 1, '#7fbb59', 1.5);
  line(17, -5, 34, -3, '#8bc764', 1.5);

  // 身体
  ctx.save();
  ctx.translate(-recoil, -62);
  ctx.scale(inflate, 2 - inflate);
  const bg = ctx.createLinearGradient(-24, -30, 24, 28);
  bg.addColorStop(0, '#a9e888');
  bg.addColorStop(0.55, '#79c665');
  bg.addColorStop(1, '#4d934b');
  ctx.fillStyle = bg;
  ctx.strokeStyle = '#1d3a20';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(0, 0, 31, 34, -0.05, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 肚子纹路
  ctx.strokeStyle = 'rgba(48,105,45,.42)';
  ctx.lineWidth = 2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(0, 6, 22 - i * 6, 0.25, 2.55);
    ctx.stroke();
  }
  // 斑点
  ctx.fillStyle = 'rgba(53,111,47,.4)';
  circle(-17, 7, 4, 'rgba(53,111,47,.4)');
  circle(-7, 20, 2.7, 'rgba(53,111,47,.4)');
  circle(15, 13, 3.6, 'rgba(53,111,47,.4)');

  // 炮口
  ctx.fillStyle = '#8ed87a';
  ctx.strokeStyle = '#1d3a20';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(17, -19);
  ctx.quadraticCurveTo(38, -18, 48, -10);
  ctx.lineTo(48, 9);
  ctx.quadraticCurveTo(36, 16, 17, 14);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 枪口
  const mp = 1 + (pl.state === 'windup' ? Math.sin(t * 18) * 0.08 * pl.telegraph : 0);
  ctx.save();
  ctx.translate(48, -1);
  ctx.scale(mp, mp);
  ctx.fillStyle = '#29492c';
  ctx.strokeStyle = '#132817';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, 0, 7, 15, 0, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = pl.state === 'windup' ? alpha('#e4ffb3', 0.45 + pl.telegraph * 0.5) : '#0f1d13';
  ctx.beginPath();
  ctx.ellipse(1, 0, 4.2, 10, 0, 0, TAU);

  ctx.restore();

  // 眼睛
  ctx.fillStyle = EYE_WHITE;
  ctx.strokeStyle = '#1a2e1b';
