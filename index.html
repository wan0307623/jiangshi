<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06110e">
<title>脑夜潜行 · Brain Crawl</title>
<style>
  :root{
    --bg:#030908;
    --panel:rgba(10,24,19,.94);
    --panel-2:rgba(16,38,29,.9);
    --ink:#eef8df;
    --muted:#96ae99;
    --faint:#657a6b;
    --lime:#b9f36b;
    --lime-2:#79d957;
    --lime-deep:#3e8f3c;
    --amber:#ffc15b;
    --pink:#ff9fba;
    --red:#ff6b5b;
    --cyan:#8be8ff;
    --stroke:rgba(185,243,107,.22);
    --stroke-soft:rgba(255,255,255,.075);
    --font:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;
    --display:"Arial Black","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    color:var(--ink);
    font-family:var(--font);
    background:
      radial-gradient(1200px 680px at 50% -12%, #143d32 0%, #081914 44%, #030a09 100%),
      #030908;
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.38;
    background-image:
      linear-gradient(rgba(185,243,107,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(185,243,107,.03) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(900px 600px at 50% 45%, #000 0%, transparent 78%);
    mask-image:radial-gradient(900px 600px at 50% 45%, #000 0%, transparent 78%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%);
  }

  button{font:inherit;color:inherit}
  button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
  .hidden{display:none !important}

  #app{
    position:relative;
    z-index:1;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px clamp(10px,2.6vw,26px) 16px;
  }

  /* ───────────────────────── top bar ───────────────────────── */
  #topbar{
    width:min(1180px, 94vw, calc((100dvh - 190px) * 1.7778));
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px 14px;
    padding:9px 12px;
    border:1px solid var(--stroke);
    border-radius:15px;
    background:linear-gradient(180deg, rgba(19,43,33,.92), rgba(7,19,15,.92));
    box-shadow:0 10px 35px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  .tb-left{display:flex;align-items:center;gap:10px;flex:0 1 386px;min-width:0}
  .tb-mid{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;max-width:270px;min-width:96px;padding:0 2px}
  .tb-mid-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tb-mid-head span{font-size:9px;letter-spacing:.15em;color:#78917a;font-weight:700;white-space:nowrap}
  .tb-mid-head b{font-size:9px;color:#c7e6b6;font-weight:800;font-variant-numeric:tabular-nums}
  .progress-track{height:6px;border-radius:99px;background:#06110d;border:1px solid #294636;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
  #progressFill{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4fa759,#b9f36b);box-shadow:0 0 8px rgba(185,243,107,.4);transition:width .2s ease-out}
  .tb-res{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .tb-level{display:flex;flex-direction:column;gap:1px;flex:0 1 auto;min-width:96px}
  .tb-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}

  .avatar{
    width:36px;height:36px;flex:0 0 36px;border-radius:12px;
    background:linear-gradient(145deg,#284b33,#11271d);
    border:1px solid rgba(185,243,107,.28);
    display:grid;place-items:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  }
  .avatar svg{width:27px;height:27px;display:block}

  .hp-wrap{flex:1 1 auto;min-width:110px;max-width:318px}
  .hp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
  .hp-label{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}
  .hp-num{font-size:11px;color:#d9f7c2;font-weight:800;font-variant-numeric:tabular-nums}
  .hp-track{
    height:11px;border-radius:99px;overflow:hidden;position:relative;
    background:#06110d;border:1px solid #294636;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.55);
  }
  #hpFill{
    height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#4fb84c,#9ee65d 62%,#d2ff8a);
    transition:width .18s ease-out, background .25s ease;
    position:relative;
  }
  #hpFill::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.18) 0 5px, transparent 5px 11px);
    opacity:.75;
  }
  #hpFill.low{background:linear-gradient(90deg,#c43c2c,#ff6b4b 62%,#ffc15b)}
  #hpFill.crit{background:linear-gradient(90deg,#8f1f1b,#ff4b3d 65%,#ff9c6a);animation:hpPulse .55s ease-in-out infinite alternate}
  @keyframes hpPulse{from{filter:brightness(.85)}to{filter:brightness(1.35)}}

  .resource{
    display:inline-flex;align-items:center;gap:5px;
    height:29px;padding:0 9px 0 7px;border-radius:99px;
    background:rgba(52,16,32,.62);border:1px solid rgba(255,159,186,.28);
    color:#ffd7e3;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  }
  .resource svg{width:17px;height:17px;display:block}
  .dashbox{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .dash-row{display:flex;align-items:center;gap:4px;height:22px}
  .pip{
    width:12px;height:19px;
    clip-path:polygon(52% 0,100% 0,66% 41%,100% 41%,38% 100%,46% 56%,0 56%);
    background:#1b3027;border:1px solid rgba(255,255,255,.06);
    transition:background .18s, box-shadow .18s, opacity .18s;
  }
  .pip.on{background:linear-gradient(180deg,#fff4b3,#ffc15b 55%,#ff9e3f);box-shadow:0 0 9px rgba(255,193,91,.55)}
  .dash-meter{width:38px;height:3px;border-radius:99px;background:#16281f;overflow:hidden}
  .dash-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc15b,#fff4b3);border-radius:99px}

  #levelText{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--lime);white-space:nowrap}
  #objectiveText{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

  .chip{
    display:inline-flex;align-items:center;gap:5px;
    height:30px;padding:0 10px;border-radius:9px;
    border:1px solid rgba(185,243,107,.2);
    background:linear-gradient(180deg,rgba(35,70,50,.9),rgba(17,38,27,.9));
    color:#ddf6c8;font-size:12px;font-weight:800;letter-spacing:.02em;
    cursor:pointer;white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .1s, filter .15s, opacity .15s;
  }
  .chip:hover:not(:disabled){filter:brightness(1.18)}
  .chip:active:not(:disabled){transform:translateY(2px);box-shadow:none}
  .chip:disabled{opacity:.34;cursor:not-allowed}
  .chip kbd{
    font-family:var(--font);font-size:9px;line-height:1;
    padding:2px 4px;border-radius:4px;background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.1);color:#b7cfae;
  }
  .chip .cost{color:var(--pink);font-size:10px;font-weight:900}
  .chip.heal .cost{color:var(--pink)}
  .chip.stock .cost{color:var(--amber)}

  .icon-btn{
    width:29px;height:29px;border-radius:9px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(12,28,21,.85);color:#afc8ad;
    display:grid;place-items:center;cursor:pointer;
    transition:filter .15s, background .15s;
  }
  .icon-btn:hover{filter:brightness(1.3)}
  .icon-btn svg{width:14px;height:14px;display:block;fill:currentColor}
  .icon-btn.off{color:#5f7463}

  /* ───────────────────────── stage ───────────────────────── */
  #stage{
    position:relative;
    width:min(1180px, 94vw, calc((100dvh - 190px) * 1.7778));
    aspect-ratio:16 / 9;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(185,243,107,.24);
    background:#06110e;
    box-shadow:
      0 28px 75px rgba(0,0,0,.6),
      0 0 0 6px rgba(6,18,13,.45),
      inset 0 0 0 1px rgba(255,255,255,.04);
    isolation:isolate;
  }
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    box-shadow:inset 0 0 90px rgba(0,0,0,.48);
    border-radius:inherit;
  }
  #stage.low::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    box-shadow:inset 0 0 55px rgba(255,55,42,.28);
    border-radius:inherit;
    animation:lowWarn 1.1s ease-in-out infinite alternate;
  }
  @keyframes lowWarn{from{opacity:.25}to{opacity:.9}}
  canvas{
    width:100%;height:100%;display:block;
    touch-action:none;
  }

  #coach{
    position:absolute;z-index:8;left:50%;bottom:13px;
    transform:translate(-50%,8px);
    max-width:92%;
    padding:7px 13px;
    border-radius:99px;
    border:1px solid rgba(185,243,107,.24);
    background:rgba(4,13,10,.82);
    color:#dff6cc;
    font-size:clamp(10px,1.35vw,13px);
    font-weight:700;
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    opacity:0;pointer-events:none;
    transition:opacity .18s, transform .18s;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  #coach.show{opacity:1;transform:translate(-50%,0)}
  #coach b{color:var(--lime)}

  #toast{
    position:absolute;z-index:9;left:50%;top:12px;
    transform:translate(-50%,-8px);
    padding:7px 14px;border-radius:99px;
    background:rgba(6,17,13,.9);
    border:1px solid rgba(185,243,107,.26);
    color:#e8ffd4;font-size:clamp(10px,1.25vw,13px);font-weight:800;
    opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;
    white-space:nowrap;
    max-width:92%;
    overflow:hidden;text-overflow:ellipsis;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,107,91,.45);color:#ffd7d1}
  #toast.good{border-color:rgba(185,243,107,.45);color:#e9ffd4}

  #damageFlash{
    position:absolute;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 38%, rgba(255,53,40,.62) 100%);
    opacity:0;
  }
  #damageFlash.hit{animation:hurtFlash .42s ease-out}
  @keyframes hurtFlash{0%{opacity:.95}100%{opacity:0}}

  #mobile-info{display:none}
  body.touch #hints{display:none}
  #hints{
    width:min(1180px,94vw);
    display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
    color:#6f8774;font-size:10px;letter-spacing:.03em;
  }
  #hints b{color:#a8c49f;font-weight:700}
  .dot-sep{opacity:.35}

  /* ───────────────────────── touch controls ───────────────────────── */
  #touch{
    position:fixed;z-index:45;
    left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));
    display:none;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 clamp(12px,4vw,30px);
    pointer-events:none;
  }
  body.touch #touch{display:flex}
  #touch .cluster{display:flex;align-items:flex-end;gap:9px;pointer-events:none}
  .tbtn{
    pointer-events:auto;
    width:60px;height:60px;
    border-radius:18px;
    border:1px solid rgba(185,243,107,.28);
    background:linear-gradient(180deg,rgba(35,70,50,.92),rgba(11,27,19,.94));
    color:#ddf6c8;
    font-size:18px;font-weight:900;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    touch-action:none;
    box-shadow:0 5px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
    transition:transform .06s, filter .1s;
    -webkit-user-select:none;user-select:none;
  }
  .tbtn span{font-size:9px;font-weight:700;letter-spacing:.1em;color:#9ebc9a;line-height:1}
  .tbtn.pressed{transform:translateY(4px) scale(.97);filter:brightness(1.35);box-shadow:none}
  .tbtn.dir{width:64px;height:64px;font-size:22px}
  .tbtn.bite{
    width:78px;height:78px;border-radius:24px;
    background:linear-gradient(180deg,rgba(111,56,35,.97),rgba(45,22,16,.98));
    border-color:rgba(255,193,91,.45);color:#ffe4b6;font-size:25px;
  }
  .tbtn.bite span{color:#ffc98a}
  .tbtn.dash{color:#fff0b1;border-color:rgba(255,193,91,.28)}
  .tbtn.crouch{color:#bfe7ff;border-color:rgba(139,232,255,.25)}
  .tbtn small{font-size:8px;color:#8fa995;letter-spacing:.08em}

  /* ───────────────────────── overlay / menus ───────────────────────── */
  #overlay{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(12px,3vw,30px);
    overflow-y:auto;
    background:
      radial-gradient(900px 620px at 50% 28%, rgba(17,54,42,.72), rgba(2,7,6,.91) 72%),
      rgba(2,7,6,.84);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  #overlay.hidden{display:none}
  .ov-card{
    position:relative;
    width:min(790px,100%);
    max-height:calc(100dvh - 24px);
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:clamp(20px,3.6vw,42px);
    border-radius:26px;
    border:1px solid rgba(185,243,107,.22);
    background:
      radial-gradient(700px 280px at 18% -10%, rgba(83,142,81,.24), transparent 65%),
      linear-gradient(150deg, rgba(18,40,31,.985), rgba(6,16,13,.985));
    box-shadow:
      0 40px 100px rgba(0,0,0,.72),
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 0 0 1px rgba(255,255,255,.025);
    animation:cardIn .28s cubic-bezier(.2,.8,.3,1) both;
    scrollbar-width:thin;
    scrollbar-color:#365b43 transparent;
  }
  .ov-card::-webkit-scrollbar{width:8px}
  .ov-card::-webkit-scrollbar-thumb{background:#365b43;border-radius:99px}
  .ov-card::before{
    content:"";position:absolute;inset:10px;border-radius:19px;pointer-events:none;
    border:1px dashed rgba(185,243,107,.1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

  .eyebrow{
    display:flex;align-items:center;gap:8px;
    font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
    color:var(--lime);margin-bottom:15px;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}
  .eyebrow .line{height:1px;flex:1;background:linear-gradient(90deg,rgba(185,243,107,.24),transparent)}

  .title-lockup{display:flex;align-items:center;gap:clamp(12px,2.5vw,22px);margin-bottom:16px}
  .logo-zombie{
    width:clamp(64px,12vw,94px);height:clamp(64px,12vw,94px);
    flex:0 0 auto;border-radius:26%;
    background:
      radial-gradient(circle at 28% 22%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(145deg,#325a3b,#10251b);
    border:1px solid rgba(185,243,107,.32);
    display:grid;place-items:center;
    box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    transform:rotate(-3deg);
  }
  .logo-zombie svg{width:78%;height:78%;display:block}
  h1{
    margin:0;
    font-family:var(--display);
    font-size:clamp(42px,8.4vw,76px);
    line-height:.9;
    letter-spacing:-.06em;
    background:linear-gradient(180deg,#f5ffdb 0%,#c5f77b 48%,#79c94e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 rgba(4,18,11,.55));
  }
  .latin{
    margin:7px 0 0;
    font-family:var(--display);
    font-size:clamp(9px,1.5vw,12px);
    letter-spacing:.38em;
    color:#88ac7e;
    font-weight:900;
  }
  .lede{
    margin:0 0 18px;
    max-width:58ch;
    color:#c4d9bf;
    font-size:clamp(13px,1.7vw,15px);
    line-height:1.72;
  }
  .lede em{font-style:normal;color:#eaffd5;font-weight:800}
  .touch-only{display:none}
  body.touch .touch-only{display:block}
  .touch-note{
    margin:-7px 0 15px;padding:8px 11px;border-radius:10px;
    border:1px solid rgba(139,232,255,.16);
    background:rgba(15,40,38,.4);
    color:#b7d9d2;font-size:11px;line-height:1.6;
  }
  .feature-row{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px}
  .fchip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:99px;
    border:1px solid rgba(185,243,107,.18);
    background:rgba(24,51,37,.55);
    color:#c9e2c0;font-size:10px;font-weight:800;letter-spacing:.06em;
  }
  .fchip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime);box-shadow:0 0 7px var(--lime)}

  .title-cols{display:grid;grid-template-columns:1.08fr .92fr;gap:14px;margin-bottom:20px}
  .info-card{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(4,13,10,.38);
    border-radius:16px;
    padding:14px 15px;
  }
  .info-card h3{
    margin:0 0 10px;font-size:10px;letter-spacing:.18em;color:#8fae8c;text-transform:uppercase;
  }
  .keygrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
  .keyrow{display:flex;align-items:center;gap:7px;min-width:0;font-size:11px;color:#cfe2c8}
  .keyrow .keys{display:flex;gap:3px;flex:0 0 auto}
  .keyrow b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  kbd{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:19px;height:19px;padding:0 5px;
    border-radius:5px;border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,#243d2e,#15251c);
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    color:#e8f7dd;font-family:var(--font);font-size:9px;font-weight:800;
  }
  .mission p{margin:0 0 9px;color:#adc5a8;font-size:11px;line-height:1.65}
  .mission p:last-child{margin-bottom:0}
  .mission .big{color:#e6ffcf;font-size:22px;font-weight:900;line-height:1;margin:0 0 8px;font-family:var(--display);letter-spacing:-.02em}
  .mission .accent{color:var(--amber)}

  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{
    appearance:none;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    min-height:44px;padding:0 20px;border-radius:13px;
    font-size:13px;font-weight:900;letter-spacing:.03em;
    transition:transform .1s, filter .15s, box-shadow .15s;
    white-space:nowrap;
  }
  .btn.primary{
    color:#08210d;
    background:linear-gradient(180deg,#d8ff9b,#9ce65d 55%,#6ec94b);
    box-shadow:0 5px 0 #326e2b, 0 14px 28px rgba(94,205,74,.24), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #326e2b}
  .btn.primary .arrow{font-size:17px;line-height:1;transform:translateY(-1px)}
  .btn.ghost{
    color:#c4d9bd;background:rgba(18,37,28,.7);
    border:1px solid rgba(255,255,255,.11);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .btn.ghost:hover{background:rgba(28,55,40,.8)}
  .btn.small{min-height:38px;padding:0 15px;font-size:11px;border-radius:11px}

  /* level intro / result cards */
  .intro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .night-badge{
    display:inline-flex;align-items:center;gap:7px;

  h2{

  .stat-box{

  .stat-box span{display:block;font-size:9px;letter-spacing:.16em;color:#809a7c;margin-bottom:5px}

  .tipbox{

  }
  .tipbox .tipmark{

  .tipbox p{margin:0;font-size:11px;line-height:1.65;color:#c8d8bd}

  .result-hero{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}

    width:70px;height:70px;flex:0 0 70px;border-radius:24px;

  }
  .result-mark.bad{border-color:rgba(255,107,91,.36);color:#ff8b7d;background:radial-gradient(circle at 35% 25%,rgba(255,107,91,.2),rgba(34,13,11,.9))}
  .result-mark.warm{border-color:rgba(255,193,91,.4);color:#ffd17d;background:radial-gradient(circle at 35% 25%,rgba(255,193,91,.2),rgba(35,25,9,.9))}
  .result-copy h2{margin:0 0 4px}
  .result-copy p{margin:0;color:#9db898;font-size:12px;line-height:1.6}
  .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 20px}
  .result-cell{
    padding:11px 12px;border-radius:12px;
    background:rgba(3,11,8,.42);border:1px solid rgba(255,255,255,.075);
  }
  .result-cell span{display:block;font-size:9px;letter-spacing:.14em;color:#7d957a;margin-bottom:5px}
  .result-cell b{font-family:var(--display);font-size:19px;color:#e9ffd4;letter-spacing:-.02em}
  .result-cell b small{font-family:var(--font);font-size:9px;color:#8da489;font-weight:700;margin-left:2px}

  .progress-dots{display:flex;gap:6px;align-items:center;margin:0 0 12px}
  .progress-dots i{width:22px;height:4px;border-radius:99px;background:#2b4232}
  .progress-dots i.on{background:var(--lime);box-shadow:0 0 8px rgba(185,243,107,.5)}

  /* menu responsive */
  @media (max-width:1120px) and (min-width:761px){
    .tb-mid{display:none}

  @media (max-width:760px){

    }

    .tb-mid{display:none}
    .tb-res{gap:6px}
    .tb-level{display:none}

    .tb-actions .chip{padding:0 7px}
    .avatar{width:30px;height:30px;flex-basis:30px;border-radius:9px}
    .avatar svg{width:23px;height:23px}
    .hp-wrap{min-width:72px;max-width:none}
    .hp-label,.hp-num{font-size:9px}
    .hp-track{height:9px}
    .chip{height:32px;padding:0 8px;font-size:11px}
    .chip kbd{display:none}
    .icon-btn{width:32px;height:32px}
    .resource{height:32px;font-size:12px;padding-right:7px}
    .dashbox{gap:2px}
    .dash-row{height:24px}
    .pip{width:10px;height:17px}
    #stage{
      width:min(1180px,96vw,calc((100dvh - 235px) * 1.7778));
      border-radius:13px;
    }
    body.touch #stage{
      width:min(1180px,96vw,calc((100dvh - 250px) * 1.7778));
    }
    #hints{display:none}
    body.touch #mobile-info{
      display:flex;flex-direction:column;gap:5px;
      width:96vw;padding:8px 11px 7px;border-radius:12px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg,rgba(17,38,29,.9),rgba(7,19,15,.9));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }
    .mi-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    .mi-top span{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--lime)}
    .mi-top b{font-size:11px;color:#d8edc9;font-variant-numeric:tabular-nums}
    .mi-bar{height:5px;border-radius:99px;background:#06110d;border:1px solid #294636;overflow:hidden}
    .mi-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fa759,#b9f36b);border-radius:99px;transition:width .2s}
    .mi-foot{display:flex;justify-content:space-between;gap:8px;color:#7f997c;font-size:9px;letter-spacing:.03em}

    #coach{bottom:7px;padding:6px 10px;max-width:96%}
    #toast{top:7px}
    .title-cols{grid-template-columns:1fr;gap:9px}
    .keygrid{grid-template-columns:1fr 1fr;gap:6px 8px}
    .level-strip{grid-template-columns:1fr}
    .ov-card{border-radius:20px;padding:20px 18px}

    .result-grid{grid-template-columns:repeat(3,1fr);gap:6px}
    .result-cell{padding:9px}

    .btn{min-height:42px;padding:0 16px;font-size:12px}
    #touch{bottom:calc(8px + env(safe-area-inset-bottom))}
    .tbtn{width:56px;height:56px;border-radius:16px}
    .tbtn.dir{width:58px;height:58px}
    .tbtn.bite{width:70px;height:70px;border-radius:21px;font-size:23px}
  }
  @media (max-width:760px) and (orientation:portrait){
    #app{justify-content:flex-start;padding-top:max(8px, env(safe-area-inset-top))}
  }
  @media (orientation:landscape) and (max-height:560px){
    #app{padding:5px 8px;gap:5px}
    #topbar{
      width:min(1180px,96vw,calc((100dvh - 160px) * 1.7778));
      padding:5px 9px;border-radius:10px;
    }
    .tb-actions{width:auto;margin-left:auto}
    .tb-left{flex:1 1 auto}
    .hp-wrap{max-width:180px}
    .tb-level{display:flex}
    #stage{width:min(1180px,96vw,calc((100dvh - 160px) * 1.7778));border-radius:11px}
    body.touch #stage{width:min(1180px,96vw,calc((100dvh - 150px) * 1.7778))}
    #touch{bottom:6px;padding:0 12px}
    .tbtn{width:48px;height:48px;border-radius:14px;font-size:15px}
    .tbtn span{font-size:8px}
    .tbtn.dir{width:52px;height:52px;font-size:19px}
    .tbtn.bite{width:60px;height:60px;border-radius:18px;font-size:20px}
    .ov-card{padding:18px 22px}
    h1{font-size:clamp(38px,7vw,58px)}
    .lede{margin-bottom:12px;line-height:1.55}
    .feature-row{margin-bottom:12px}
    .title-cols{margin-bottom:12px}
  }
  @media (max-width:520px){
    .title-lockup{gap:11px;margin-bottom:11px}
    .logo-zombie{width:60px;height:60px;border-radius:18px}
    h1{font-size:44px}
    .latin{letter-spacing:.24em}
    .lede{font-size:12px;line-height:1.62;margin-bottom:12px}
    .feature-row{margin-bottom:13px}
    .fchip{font-size:9px;padding:4px 8px}
    .title-cols{gap:8px;margin-bottom:14px}
    .info-card{padding:11px 12px}
    .keyrow{font-size:10px}
    .actions{gap:8px}
    .btn.primary{padding:0 17px;font-size:12px}
    .action-note{display:none}
    .result-hero{gap:11px;margin-bottom:12px}
    .result-mark{width:56px;height:56px;flex-basis:56px;border-radius:17px;font-size:24px}

    .night-badge{font-size:9px}
    h2{font-size:34px}

  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>

<body>
  <div id="app">
    <header id="topbar" aria-label="游戏状态">
      <div class="tb-left">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" aria-label="僵尸头像">
            <path d="M20 13c5-5 14-5 20-1 2-2 5-2 7 0 2 2 2 5 1 7 4 4 5 11 2 16-3 6-9 9-17 9-9 0-16-4-18-11-2-5-1-10 2-13-1-3 0-6 3-7Z" fill="#9fc46d" stroke="#17251a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M22 14c2-4 7-6 11-4l1 6 3-7c4 0 7 2 8 5l-5 2 7 2" fill="#20382a" stroke="#17251a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="28" cy="31" rx="7.4" ry="8.2" fill="#f7ffdc" stroke="#17251a" stroke-width="2.4"/>
            <circle cx="25.8" cy="32" r="3.4" fill="#1b2b20"/>
            <circle cx="24.6" cy="30.8" r="1" fill="#fff"/>
            <path d="M41 29c2-1 4 0 4 2" stroke="#17251a" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M24 44c4 4 11 4 15 1" fill="none" stroke="#17251a" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M29 44v4M34 45v4" stroke="#f8ffdf" stroke-width="2" stroke-linecap="round"/>
            <path d="M43 38l4 2M44 43l4 2" stroke="#213a27" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hp-wrap">
          <div class="hp-head"><span class="hp-label">生命</span><span class="hp-num" id="hpText">100 / 100</span></div>
          <div class="hp-track"><div id="hpFill"></div></div>
        </div>
      </div>

      <div class="tb-mid" aria-hidden="true">
        <div class="tb-mid-head"><span>归家进度</span><b id="progressText">0%</b></div>
        <div class="progress-track"><i id="progressFill"></i></div>
      </div>

      <div class="tb-res">
        <div class="resource" title="脑能：可以兑换愈合或冲刺">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.1c-1.3-1.5-3.8-1.4-4.9.3-.3.5-.4 1.1-.2 1.7-1.7.4-2.7 2-2.2 3.8-.9 1.6-.2 3.5 1.5 4.2.2 1.9 1.8 3.3 3.7 3.3.8 0 1.5-.2 2.1-.6V4.1Z" fill="#ff9fba" stroke="#5b2538" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M12 4.1c1.3-1.5 3.8-1.4 4.9.3.3.5.4 1.1.2 1.7 1.7.4 2.7 2 2.2 3.8.9 1.6.2 3.5-1.5 4.2-.2 1.9-1.8 3.3-3.7 3.3-.8 0-1.5-.2-2.1-.6V4.1Z" fill="#ffb4c9" stroke="#5b2538" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M9 8.2c-1.1 0-1.9.7-2 1.7M15 8.2c1.1 0 1.9.7 2 1.7M8.6 14.2c1 .6 2 .7 3 .4M15.4 14.2c-1 .6-2 .7-3 .4" fill="none" stroke="#7c2f47" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
          <span id="brainText">0</span>
        </div>
        <div class="dashbox" title="冲刺充能">
          <div class="dash-row" id="dashPips"></div>
          <div class="dash-meter"><i id="dashMeter"></i></div>
        </div>
      </div>

      <div class="tb-level">
        <span id="levelText">第 1 夜</span>
        <span id="objectiveText">← 家 0m</span>
      </div>

      <div class="tb-actions">
        <button class="chip heal" id="healBtn" type="button" title="消耗 1 点脑能恢复生命（快捷键 1）">愈合 <span class="cost">1脑</span><kbd>1</kbd></button>
        <button class="chip stock" id="stockBtn" type="button" title="消耗 1 点脑能获得一次冲刺（快捷键 2）">蓄冲 <span class="cost">1脑</span><kbd>2</kbd></button>
        <button class="icon-btn" id="muteBtn" type="button" aria-label="静音" title="静音">
          <svg id="muteIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm11.5-.7a5.2 5.2 0 0 1 0 7.4l-1.4-1.4a3.2 3.2 0 0 0 0-4.6l1.4-1.4Zm2.8-2.8a9.2 9.2 0 0 1 0 13l-1.4-1.4a7.2 7.2 0 0 0 0-10.2l1.4-1.4Z"/></svg>
        </button>
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停" title="暂停（P）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <canvas id="game" width="960" height="540" aria-label="脑夜潜行游戏画面：控制僵尸从右向左潜行"></canvas>
      <div id="damageFlash"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="coach"></div>
    </main>

    <div id="mobile-info" aria-hidden="true">
      <div class="mi-top"><span id="miLevel">第一夜</span><b id="miObjective">← 家 0m</b></div>
      <div class="mi-bar"><i id="miProgress"></i></div>
      <div class="mi-foot"><span>蹲下少中弹 · 掩体会碎</span><span class="rotate">横屏体验更佳</span></div>
    </div>

    <div id="hints">
      <span><b>A / D</b> 移动</span><span class="dot-sep">·</span>
      <span><b>S</b> 蹲下</span><span class="dot-sep">·</span>
      <span><b>Shift</b> 冲刺</span><span class="dot-sep">·</span>
      <span><b>空格</b> 啃咬</span><span class="dot-sep">·</span>
      <span><b>1 / 2</b> 脑能</span><span class="dot-sep">·</span>
      <span><b>P</b> 暂停</span>
    </div>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="cluster">
      <button class="tbtn dir" data-hold="left" type="button" aria-label="向左移动">◀<span>左</span></button>
      <button class="tbtn dir" data-hold="right" type="button" aria-label="向右移动">▶<span>右</span></button>
    </div>
    <div class="cluster">
      <button class="tbtn crouch" data-hold="crouch" type="button" aria-label="蹲下">蹲<span>蹲下</span></button>
      <button class="tbtn dash" data-tap="dash" type="button" aria-label="冲刺">冲<span>冲刺</span></button>
      <button class="tbtn bite" data-hold="bite" type="button" aria-label="啃咬">啃<span>啃咬</span></button>
    </div>
  </div>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true"></div>

<script>
/* ============================================================
   脑夜潜行 · Brain Crawl
   单文件 Canvas 小游戏 / 原创占位画风 / 无外部素材
   ------------------------------------------------------------
   所有玩法/平衡数值集中在 CONFIG 中，含中文注释，方便调整手感。
   绘制函数里的坐标是画风细节，不参与平衡计算。
   操作：A/D 移动，S 蹲下，Shift 冲刺，空格啃咬，1 愈合，2 蓄冲。
   ============================================================ */

const CONFIG = {
  /* ── 画布与场地 ───────────────────────────────────────── */
  view: {
    width: 960,              // 逻辑画布宽度
    height: 540,             // 逻辑画布高度
    groundY: 452             // 地面基线（角色脚底）
  },
  world: {
    pixelsPerMeter: 12,      // HUD 距离换算：12 像素 = 1 米
    walkPad: 24,             // 玩家不能越过的最右侧边距
    leftPad: 18,             // 玩家不能越过的最左侧边距
    levelGrace: 1.0          // 关卡开始后植物延迟开火的时间（秒）
  },
  camera: {
    lookAhead: 0.42,         // 玩家在屏幕上的横向位置比例
    smooth: 5.2,             // 镜头跟随平滑速度
    shakeDecay: 16           // 屏幕震动衰减速度
  },

  /* ── 玩家：一只想回家的僵尸 ────────────────────────────── */
  player: {
    maxHp: 100,              // 最大生命
    standHeight: 104,        // 站立受击高度
    crouchHeight: 70,        // 蹲下受击高度（更矮，豆子更容易从头顶飞过）
    bodyWidth: 42,           // 受击宽度
    speed: 184,              // 站立移动速度（像素/秒）
    crouchSpeed: 76,         // 蹲下移动速度
    accel: 1500,             // 地面加速度
    friction: 2100,          // 松开方向键后的减速度
    dashSpeed: 620,          // 冲刺速度
    dashDuration: 0.18,      // 冲刺持续时间（秒）
    dashRegen: 3.1,          // 自动回复一次冲刺所需时间（秒）
    maxDashCharges: 2,       // 冲刺充能上限
    startDashCharges: 1,     // 初始冲刺充能
    dashInvuln: 0.24,        // 冲刺期间无敌时间（覆盖整个冲刺）
    hurtInvuln: 0.65,        // 受伤后的短暂无敌时间
    slowFactor: 0.55,        // 被冰冻后的移动速度倍率
    slowDuration: 1.9,       // 冰冻减速持续时间
    biteRange: 84,           // 可开始啃咬的最大距离
    biteContact: 52,         // 被植物挡住时的身体中心距离
    biteApproachSlack: 10,   // 允许开始啃咬的贴近容差
    biteDps: 46,             // 站立啃咬每秒伤害
    crouchBiteFactor: 0.72,  // 蹲着啃咬的速度倍率（更安全但更慢）
    crouchThreshold: 0.5,    // 蹲伏动画超过该值时按蹲姿处理
    biteSnap: 15,            // 啃咬时贴近植物的平滑速度
    healCost: 1,             // 愈合消耗脑能
    healAmount: 30,          // 愈合恢复生命
    stockCost: 1,            // 蓄冲消耗脑能
    startBrain: 0,           // 每关开始时的脑能
    hitFlashTime: 0.16,      // 受击白闪时间
    lowHp: 35,               // 低生命警告阈值（生命值）
    critHpPct: 15,           // 生命条进入危急红色的百分比阈值
    biteSfxInterval: 0.19    // 啃咬音效/碎屑间隔
  },

  /* ── 植物：三种固定防守者 ──────────────────────────────── */
  plants: {
    pea: {
      label: '咕噜荚',       // 豌豆射手对应物
      hp: 70,                 // 啃咬血量
      aggro: 620,             // 发现玩家并开始攻击的距离
      windup: 0.55,           // 攻击前摇（鼓气时间）
      cooldown: 1.95,         // 两次射击之间的间隔

const W = CONFIG.view.width;
const H = CONFIG.view.height;
const GROUND = CONFIG.view.groundY;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, rate, dt) => a + (b - a) * (1 - Math.exp(-rate * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const dist = (a, b) => Math.abs(a - b);
const fmtTime = s => {
  const sec = Math.max(0, s);
  const m = Math.floor(sec / 60);
  const ss = sec - m * 60;
  return m > 0 ? `${m}:${ss.toFixed(1).padStart(4, '0')}` : `${ss.toFixed(1)}s`;
};
const fmtMeters = px => Math.max(0, Math.ceil(px / CONFIG.world.pixelsPerMeter));

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const stableRand = mulberry32(20241031);

function roundPath(x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function fillRound(x, y, w, h, r, color) {
  roundPath(x, y, w, h, r);
  ctx.fillStyle = color;
  ctx.fill();
}
function strokeRound(x, y, w, h, r, color, lw = 1) {
  roundPath(x, y, w, h, r);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.stroke();
}
function ellipse(x, y, rx, ry, color, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot, 0, TAU);
  ctx.fillStyle = color;
  ctx.fill();
}
function alpha(hex, a) {
  if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function path(fill, stroke, lw, draw) {
  ctx.beginPath();
  draw();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.stroke();
}
function circle(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = color;
  ctx.fill();
}

/* ============================================================
   音效：纯 WebAudio 合成，无外部音频文件
   ============================================================ */
const Sound = {
  ctx: null,
  master: null,
  muted: false,
  noiseBuf: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = CONFIG.audio.master;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.4);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
    } catch (e) { /* 音频不可用不阻塞游戏 */ }
  },
  unlock() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(freq, dur, type = 'sine', vol = 0.25, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(Math.max(30, freq), t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  },
  noise(dur, vol = 0.15, freq = 900, delay = 0, type = 'lowpass') {
    if (!this.ctx || this.muted || !this.noiseBuf) return;
    try {
      const t = this.ctx.currentTime + delay;
      const s = this.ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master);
      s.start(t); s.stop(t + dur + 0.03);
    } catch (e) {}
  },
  click() { this.tone(420, 0.05, 'triangle', 0.14, 160); },
  shoot(type) {
    if (type === 'frost') {
      this.tone(680, 0.15, 'triangle', 0.12, -280);
      this.noise(0.08, 0.06, 2400, 0, 'highpass');
    } else {
      this.tone(230, 0.12, 'square', 0.1, -100);
      this.noise(0.06, 0.07, 700);
    }
  },
  charge(type) {
    this.tone(type === 'frost' ? 620 : 350, 0.18, 'sine', 0.05, 90);
  },
  bite() {
    this.noise(0.07, 0.13, 480);
    this.tone(92, 0.06, 'square', 0.07, -22);
  },
  hurt() {
    this.tone(150, 0.18, 'sawtooth', 0.14, -70);
    this.noise(0.14, 0.12, 420);
  },
  dash() {
    this.noise(0.18, 0.11, 1500, 0, 'bandpass');
    this.tone(280, 0.12, 'triangle', 0.09, 260);
  },
  eat() {
    [420, 560, 760].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.12, 65, i * 0.07));
    this.noise(0.18, 0.08, 600);
  },
  heal() {
    [520, 680, 840, 1040].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.1, 20, i * 0.07));
  },
  coverBreak() {
    this.noise(0.28, 0.16, 380);
    this.tone(110, 0.2, 'square', 0.08, -50);
  },
  win() {
    [392, 494, 587, 784, 988].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.13, 0, i * 0.11));
  },
  lose() {
    [330, 277, 220, 165].forEach((f, i) => this.tone(f, 0.34, 'sawtooth', 0.09, -20, i * 0.13));
  }
};

  const kind = level.theme.ambient;
  const count = kind === 'snow' ? 54 : kind === 'leaves' ? 26 : 22;
  G.ambient = Array.from({ length: count }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    z: 0.35 + Math.random() * 0.9,
    v: 6 + Math.random() * 20,
    drift: Math.random() * TAU,
    rot: Math.random() * TAU,
    size: 1 + Math.random() * 2.4,
    kind
  }));
}

function loadLevel(index, state = 'intro') {
  clearTimers();
  resetInput();
  G.levelIndex = index;
  G.level = CONFIG.levels[index];
  G.player = newPlayer(G.level.startX);
  G.plants = G.level.plants.map(makePlant);
  G.covers = G.level.covers.map(makeCover);
  G.bullets = [];
  G.particles = [];
  G.texts = [];
  G.levelTime = 0;
  G.time = 0;
  G.shake = 0;
  G.camX = clamp(G.level.startX - W * CONFIG.camera.lookAhead, 0, Math.max(0, G.level.width - W));
  initAmbient(G.level);
  G.state = state;
  el.stage.classList.remove('low');
  updateHUD(true);
  updateCoach(true);
}

function buildRun() {
  G.run = {
    levels: [],
    brains: 0,
    plants: 0,
    hits: 0,
    startedAt: performance.now()
  };
}

function startRun() {
  buildRun();
  loadLevel(0, 'intro');
  renderIntro();
  Sound.click();
}

function beginPlay(fromRetry = false) {
  hideOverlay();
  resetInput();
  G.state = 'playing';
  G.levelTime = 0;
  el.pauseBtn.disabled = false;
  updateHUD(true);
  updateCoach(true);
  if (fromRetry) showToast('再来一次。这次别站在豆子飞行的路线上。', 'good');
  else showToast(G.level.night + ' · ' + G.level.name, '');
  Sound.unlock();
  Sound.click();
}

function retryLevel() {
  const idx = G.levelIndex;
  clearTimers();
  hideOverlay();
  // 如果重玩的是已结算关卡，先撤销该关在本次总成绩里的贡献
  if (G.run && G.run.levels[idx]) {
    G.run.plants = Math.max(0, G.run.plants - (G.run.levels[idx].plants || 0));
    G.run.brains = Math.max(0, G.run.brains - (G.run.levels[idx].brains || 0));
    delete G.run.levels[idx];
  }
  loadLevel(idx, 'playing');
  beginPlay(true);
}

function nextLevel() {
  clearTimers();
  hideOverlay();
  if (G.levelIndex >= CONFIG.levels.length - 1) {
    startRun();
    return;
  }
  loadLevel(G.levelIndex + 1, 'intro');
  renderIntro();
  Sound.click();
}

function goTitle() {
  clearTimers();
  hideOverlay();
  resetInput();
  const idx = clamp(G.levelIndex, 0, CONFIG.levels.length - 1);
  loadLevel(idx, 'title');
  G.state = 'title';
  el.pauseBtn.disabled = true;
  renderTitle();
  Sound.click();
}

function togglePause() {
  if (G.state === 'playing') {
    G.state = 'paused';
    resetInput();
    renderPause();
    Sound.click();
  } else if (G.state === 'paused') {
    hideOverlay();
    G.state = 'playing';
    resetInput();
    Sound.click();
  }
}

function resumeGame() {
  if (G.state !== 'paused') return;
  hideOverlay();
  G.state = 'playing';
  resetInput();
  Sound.click();
}

/* ============================================================
   输入：键盘 + 触屏
   ============================================================ */
const KEY_LEFT = ['ArrowLeft', 'a', 'A'];
const KEY_RIGHT = ['ArrowRight', 'd', 'D'];
const KEY_CROUCH = ['ArrowDown', 's', 'S'];
const KEY_BITE = [' ', 'Spacebar', 'j', 'J', 'k', 'K'];
const KEY_DASH = ['Shift', 'ShiftLeft', 'ShiftRight', 'l', 'L'];

function primaryAction() {
  if (G.state === 'title') startRun();
  else if (G.state === 'intro') beginPlay();
  else if (G.state === 'paused') resumeGame();
  else if (G.state === 'dead') retryLevel();
  else if (G.state === 'clear') nextLevel();
  else if (G.state === 'victory') { buildRun(); loadLevel(0, 'intro'); renderIntro(); }
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  Sound.unlock();

  if (G.state === 'playing') {
    if (KEY_LEFT.includes(k)) { input.left = true; e.preventDefault(); return; }
    if (KEY_RIGHT.includes(k)) { input.right = true; e.preventDefault(); return; }
    if (KEY_CROUCH.includes(k)) { input.crouch = true; e.preventDefault(); return; }
    if (KEY_BITE.includes(k)) { input.bite = true; e.preventDefault(); return; }
    if (KEY_DASH.includes(k) && !e.repeat) { requestDash(); e.preventDefault(); return; }
    if (k === '1' && !e.repeat) { tryHeal(); e.preventDefault(); return; }
    if (k === '2' && !e.repeat) { tryStockDash(); e.preventDefault(); return; }
    if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); e.preventDefault(); return; }
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    return;
  }

  if (G.state === 'paused') {
    if (k === 'p' || k === 'P' || k === 'Escape' || k === 'Enter') { resumeGame(); e.preventDefault(); return; }
    if (k === 'r' || k === 'R') { retryLevel(); e.preventDefault(); return; }
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    return;
  }

  if (G.state === 'dead' || G.state === 'clear' || G.state === 'victory' || G.state === 'intro' || G.state === 'title') {
    const onButton = e.target && e.target.tagName === 'BUTTON';
    if ((k === 'Enter' || k === 'n' || k === 'N') && !onButton) { primaryAction(); e.preventDefault(); return; }
    if ((k === 'r' || k === 'R') && (G.state === 'dead' || G.state === 'clear')) { retryLevel(); e.preventDefault(); return; }
    if (k === 'm' || k === 'M') { toggleMute(); return; }
    if (k === 'Escape' && (G.state === 'intro' || G.state === 'dead' || G.state === 'clear' || G.state === 'victory')) {
      goTitle(); e.preventDefault();
    }
  }
});

window.addEventListener('keyup', (e) => {
  const k = e.key;
  if (KEY_LEFT.includes(k)) input.left = false;
  if (KEY_RIGHT.includes(k)) input.right = false;
  if (KEY_CROUCH.includes(k)) input.crouch = false;
  if (KEY_BITE.includes(k)) input.bite = false;
});

window.addEventListener('blur', () => { resetInput(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'playing') togglePause();
});

// 触屏长按按钮
document.querySelectorAll('[data-hold]').forEach((btn) => {
  const key = btn.dataset.hold;
  let pid = null;
  const down = (e) => {
    e.preventDefault();
    Sound.unlock();
    pid = e.pointerId;
    input[key] = true;
    btn.classList.add('pressed');
    try { btn.setPointerCapture(pid); } catch (err) {}
  };
  const up = (e) => {
    if (pid !== null && e.pointerId !== pid) return;
    e.preventDefault();
    input[key] = false;
    btn.classList.remove('pressed');
    pid = null;
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
document.querySelectorAll('[data-tap]').forEach((btn) => {
  const act = btn.dataset.tap;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    Sound.unlock();
    btn.classList.add('pressed');
    if (act === 'dash') requestDash();
    setTimeout(() => btn.classList.remove('pressed'), 110);
  });
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

el.stockBtn.addEventListener('click', () => { Sound.unlock(); tryStockDash(); el.stockBtn.blur(); });
el.muteBtn.addEventListener('click', () => { Sound.unlock(); toggleMute(); el.muteBtn.blur(); });
el.pauseBtn.addEventListener('click', () => { togglePause(); el.pauseBtn.blur(); });

function buildDashPips() {
  el.dashPips.innerHTML = '';
  for (let i = 0; i < CONFIG.player.maxDashCharges; i++) {
    const pip = document.createElement('i');
    pip.className = 'pip';
    el.dashPips.appendChild(pip);
  }
