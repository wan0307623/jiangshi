  ctx.beginPath();
  ctx.ellipse(5, -17, 8, 9.5, 0.05, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#193b24';
  ctx.beginPath();
  ctx.arc(9, -16, 3.8, 0, TAU);
  ctx.fill();
  circle(10.5, -17.3, 1.3, '#fff');
  // 眉毛
  ctx.strokeStyle = '#35672f';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(-2, -27);
  ctx.quadraticCurveTo(6, -31, 13, -26);
  ctx.stroke();
  // 嘴/腮
  ctx.strokeStyle = '#2e5e2f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 8, 6, 0.3, 2.8);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,150,150,.22)';
  circle(-12, 2, 5, 'rgba(255,150,150,.22)');

  // 头顶小叶
  ctx.strokeStyle = '#2b602b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-3, -32);
  ctx.quadraticCurveTo(-8, -46, -2, -48);
  ctx.stroke();
  path('#6fae4e', '#203c21', 2.5, () => {
    ctx.moveTo(-1, -46);
    ctx.quadraticCurveTo(-15, -56, -23, -50);
    ctx.quadraticCurveTo(-14, -40, -1, -43);
    ctx.closePath();
  });
  path('#86c765', '#203c21', 2.5, () => {
    ctx.moveTo(1, -45);
    ctx.quadraticCurveTo(12, -57, 20, -51);
    ctx.quadraticCurveTo(12, -40, 2, -42);
    ctx.closePath();
  });

  // 鼓气光
  if (pl.state === 'windup') {
    ctx.globalAlpha = pl.telegraph * 0.8;
    const gg = ctx.createRadialGradient(48, 0, 2, 48, 0, 30);
    gg.addColorStop(0, 'rgba(236,255,167,.55)');
    gg.addColorStop(1, 'rgba(185,243,107,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(48, 0, 30, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawFrostPlant(pl, t) {
  const recoil = pl.recoil * 6;
  // 冷气
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const aura = ctx.createRadialGradient(0, -66, 4, 0, -66, 48);
  aura.addColorStop(0, 'rgba(139,232,255,.12)');
  aura.addColorStop(1, 'rgba(139,232,255,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, -66, 48, 0, TAU); ctx.fill();
  ctx.restore();

  // 茎叶
  ctx.strokeStyle = '#2f6c72';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-2, -28, 0, -44);
  ctx.stroke();
  path('#3f8585', '#17383a', 3, () => {
    ctx.moveTo(-2, 0);
    ctx.bezierCurveTo(-20, -10, -34, -3, -42, 3);
    ctx.bezierCurveTo(-27, 10, -10, 9, -2, 4);
    ctx.closePath();
  });
  path('#4e9b95', '#17383a', 3, () => {
    ctx.moveTo(3, -3);
    ctx.bezierCurveTo(20, -13, 35, -7, 43, -1);
    ctx.bezierCurveTo(28, 7, 12, 8, 3, 3);
    ctx.closePath();
  });

  // 铃铛身体
  ctx.save();
  ctx.translate(-recoil, -68);
  const bg = ctx.createLinearGradient(-24, -28, 25, 27);
  bg.addColorStop(0, '#d7f9ff');
  bg.addColorStop(0.45, '#93dce9');
  bg.addColorStop(1, '#4e9fae');
  ctx.fillStyle = bg;
  ctx.strokeStyle = '#1d4650';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-23, -18);
  ctx.bezierCurveTo(-29, 6, -22, 21, -13, 26);
  ctx.quadraticCurveTo(-7, 31, 0, 24);
  ctx.quadraticCurveTo(8, 31, 14, 24);
  ctx.bezierCurveTo(24, 19, 29, 2, 21, -18);
  ctx.quadraticCurveTo(14, -34, 0, -35);
  ctx.quadraticCurveTo(-15, -34, -23, -18);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 铃口冰棱
  ctx.fillStyle = '#dffbff';
  ctx.strokeStyle = '#2a6673';
  ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    const ix = i * 9;
    const len = 7 + (i % 2 === 0 ? 5 : 0);
    ctx.beginPath();
    ctx.moveTo(ix - 4, 22);
    ctx.lineTo(ix, 22 + len);
    ctx.lineTo(ix + 4, 22);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  // 冰纹
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-8, -8); ctx.lineTo(-3, 2); ctx.lineTo(-9, 10);
  ctx.moveTo(7, -15); ctx.lineTo(2, -6); ctx.lineTo(8, 2);
  ctx.stroke();

  // 炮口冰晶
  ctx.fillStyle = '#b8f4ff';
  ctx.strokeStyle = '#1d4650';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(17, -15);
  ctx.lineTo(38, -13);
  ctx.lineTo(51, -1);
  ctx.lineTo(38, 10);
  ctx.lineTo(17, 10);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2b6a79';
  ctx.beginPath();
  ctx.ellipse(49, -1, 4.5, 8.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath();
  ctx.moveTo(24, -10); ctx.lineTo(34, -8); ctx.lineTo(28, -2);
  ctx.closePath(); ctx.fill();

  // 眼睛（困倦）
  ctx.fillStyle = EYE_WHITE;
  ctx.strokeStyle = '#1a3a42';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(3, -15, 7.5, 8, 0, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1e4a57';
  ctx.beginPath(); ctx.arc(6, -14, 3.2, 0, TAU); ctx.fill();
  circle(7, -15, 1.1, '#fff');
  // 眼皮
  ctx.fillStyle = '#93dce9';
  ctx.beginPath();
  ctx.ellipse(3, -19, 8.3, 4.2, 0, Math.PI, TAU);
  ctx.fill();
  ctx.strokeStyle = '#2f6c72';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-1, 7); ctx.quadraticCurveTo(4, 9, 9, 7);
  ctx.stroke();

  // 头顶雪花
  ctx.save();
  ctx.translate(0, -42);
  ctx.rotate(t * 0.6 + pl.seed);
  ctx.strokeStyle = '#d8faff';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 6; i++) {
    ctx.rotate(TAU / 6);
    ctx.beginPath();
    ctx.moveTo(0, -3); ctx.lineTo(0, -10);
    ctx.moveTo(0, -7); ctx.lineTo(3, -9);
    ctx.moveTo(0, -7); ctx.lineTo(-3, -9);
    ctx.stroke();
  }
  ctx.restore();

  if (pl.state === 'windup') {
    ctx.save();
    ctx.translate(46, -1);
    ctx.rotate(t * 3);
    ctx.globalAlpha = 0.3 + pl.telegraph * 0.7;
    ctx.strokeStyle = '#bff5ff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(TAU / 4);
      ctx.beginPath();
      ctx.arc(0, 0, 17 + Math.sin(t * 8 + i) * 2, 0.2, 1.2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawWallPlant(pl, t) {
  const dmg = clamp(1 - pl.hp / pl.maxHp, 0, 1);
  const breathe = 1 + Math.sin(t * 1.8 + pl.seed) * 0.008;

  // 小根脚
  ctx.strokeStyle = '#6d4a27';
  ctx.lineWidth = 4;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 16, -8);
    ctx.quadraticCurveTo(i * 20, 0, i * 25, 2);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(0, -44);
  ctx.scale(breathe, 1 / breathe);
  // 果实身体
  const bg = ctx.createLinearGradient(-32, -40, 30, 44);
  bg.addColorStop(0, '#e3b773');
  bg.addColorStop(0.5, '#c99250');
  bg.addColorStop(1, '#8d5c30');
  ctx.fillStyle = bg;
  ctx.strokeStyle = '#3f2a18';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(0, 0, 38, 46, 0.02, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 高光
  ctx.fillStyle = 'rgba(255,236,190,.28)';
  ctx.beginPath();
  ctx.ellipse(-13, -20, 12, 20, -0.5, 0, TAU);
  ctx.fill();

  // 石片
  const plate = (x, y, rx, ry, rot) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#8f9891';
    ctx.strokeStyle = '#3f4b43';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath();
    ctx.ellipse(-rx * 0.25, -ry * 0.25, rx * 0.45, ry * 0.3, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  };
  plate(-18, -33, 14, 9, -0.35);
  plate(7, -42, 16, 8, 0.15);
  plate(25, -26, 10, 12, 0.5);

  // 睡眼
  ctx.strokeStyle = '#4a301c';
  ctx.lineWidth = 2.8;
  ctx.beginPath();
  ctx.arc(-11, -8, 6, 0.15, Math.PI - 0.15);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(11, -8, 6, 0.15, Math.PI - 0.15);
  ctx.stroke();
  // 眼袋
  ctx.strokeStyle = 'rgba(80,48,27,.45)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(-11, -5, 6.5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(11, -5, 6.5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  // 嘴
  ctx.strokeStyle = '#4a301c';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-7, 12);
  ctx.quadraticCurveTo(0, 15 + Math.sin(t * 1.4) * 1, 7, 12);
  ctx.stroke();
  // 腮红
  ctx.fillStyle = 'rgba(182,84,62,.16)';
  circle(-25, 7, 6, 'rgba(182,84,62,.16)');
  circle(25, 7, 6, 'rgba(182,84,62,.16)');

  // 裂纹
  if (dmg > 0.12) {
    ctx.strokeStyle = `rgba(67,40,20,${0.5 + dmg * 0.4})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-22, -39);
    ctx.lineTo(-13, -24);
    ctx.lineTo(-19, -13);
    ctx.lineTo(-10, -1);
    ctx.stroke();
  }
  if (dmg > 0.38) {
    ctx.beginPath();
    ctx.moveTo(28, -20);
    ctx.lineTo(17, -9);
    ctx.lineTo(24, 3);
    ctx.lineTo(15, 17);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(68,43,23,.65)';
    ctx.beginPath();
    ctx.moveTo(-33, 12); ctx.lineTo(-24, 19); ctx.lineTo(-30, 30);
    ctx.stroke();
  }
  if (dmg > 0.65) {
    ctx.fillStyle = 'rgba(52,31,16,.55)';
    ctx.beginPath();
    ctx.ellipse(20, 27, 8, 6, 0.4, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,238,189,.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8, 31); ctx.lineTo(2, 39);
    ctx.stroke();
  }

  // 石壳上的小苔藓
  ctx.fillStyle = 'rgba(91,122,57,.55)';
  circle(-27, 23, 4, 'rgba(91,122,57,.55)');
  circle(-22, 27, 2.5, 'rgba(111,145,68,.5)');

  ctx.restore();
}

/* ============================================================
   绘制：玩家（原创小僵尸）
   ============================================================ */
function drawPlayerTrail(t) {
  const p = G.player;
  if (!p || p.dashT <= 0) return;
  ctx.save();
  ctx.globalAlpha = 0.4;
  for (let i = 0; i < 5; i++) {
    const len = 18 + i * 14;
    const y = GROUND - 26 - i * 13;
    const x = p.x - p.dashDir * (12 + i * 6);
    ctx.strokeStyle = i % 2 ? '#ffc15b' : '#e9ffcf';
    ctx.lineWidth = 2 - i * 0.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - p.dashDir * len, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawZombie(t) {
  const p = G.player;
  if (!p) return;
  const duck = clamp(p.crouchAmt, 0, 1);
  const dead = p.hp <= 0;
  const dash = p.dashT > 0;
  const bite = p.biting && !dash && !dead;
  const walk = (p.moving && !dash && !bite) ? Math.sin(p.walkPhase) : 0;
  const bob = (p.moving && !dash) ? Math.abs(Math.sin(p.walkPhase)) * 2.2 : Math.sin(t * 2.1) * 1.1;
  const chomp = bite ? (Math.sin(p.chompPhase) * 0.5 + 0.5) : 0;
  const look = bite ? 1.5 : (-1.2 + (p.facing === -1 ? 0 : 2));
  const bodyY = -bob;

  // 影子
  ctx.save();
  ctx.globalAlpha = 0.42;
  ellipse(p.x, GROUND + 3, 33 + duck * 6, 8, '#020705');
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.save();
  ctx.translate(p.x, GROUND);
  if (dead) {
    const k = Math.min(1, p.deathT * 3.4);
    ctx.translate(-6 * k, -2 * k);
    ctx.rotate(-1.36 * k);
  }
  if (p.facing === 1) ctx.scale(-1, 1);
  // 蹲下时微微变宽，身体各部位用 duck 变量换成蹲姿
  ctx.scale(1 + duck * 0.04, 1);
  if (p.invuln > 0 && !dash && !dead) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 34));
  }
  if (p.hitFlash > 0) ctx.filter = 'brightness(1.95)';
  if (dash) ctx.rotate(-0.12);
  ctx.translate(0, bodyY);

  const skin = '#a4cb74';
  const skinDark = '#7ea557';
  const skinLight = '#c2e38f';
  const hoodie = '#c7693e';
  const hoodieDark = '#9a4a2c';
  const hoodieLight = '#e08552';
  const pants = '#3a463d';
  const pantsDark = '#28332c';
  const shoe = '#e7dcb8';
  const shoeDark = '#8d8061';
  const scarf = '#e8b44a';

  const hipY = -38 + duck * 12;
  const shoulderY = -68 + duck * 18;
  const headY = -86 + duck * 42;
  const headR = 25 - duck * 3;
  const kneeY = -20 + duck * 7;

  const legSwing = walk * 9 + (dash ? 12 : 0);
  const armSwing = walk * 7;

  // 后腿
  ctx.strokeStyle = pantsDark;
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(4, hipY);
  ctx.quadraticCurveTo(14 - legSwing * 0.4, kneeY, 13 - legSwing, -4);
  ctx.stroke();
  ctx.strokeStyle = pants;
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(4, hipY);
  ctx.quadraticCurveTo(14 - legSwing * 0.4, kneeY, 13 - legSwing, -4);
  ctx.stroke();
  // 后鞋
  ctx.save();
  ctx.translate(13 - legSwing, -4);
  ctx.rotate(0.07);
  fillRound(-9, 0, 23, 8, 4, shoeDark);
  fillRound(-8, -1, 20, 6, 3, shoe);
  ctx.restore();

  // 前腿
  ctx.strokeStyle = pantsDark;
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(-5, hipY);
  ctx.quadraticCurveTo(-14 + legSwing * 0.4, kneeY, -15 + legSwing, -4);
  ctx.stroke();
  ctx.strokeStyle = pants;
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(-5, hipY);
  ctx.quadraticCurveTo(-14 + legSwing * 0.4, kneeY, -15 + legSwing, -4);
  ctx.stroke();
  // 前鞋（一只偏红）
  ctx.save();
  ctx.translate(-15 + legSwing, -4);
  ctx.rotate(-0.08);
  fillRound(-11, 0, 24, 8, 4, shoeDark);
  fillRound(-10, -1, 21, 6, 3, '#d46c4f');
  ctx.restore();

  // 后手臂
  ctx.strokeStyle = hoodieDark;
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(11, shoulderY + 5);
  ctx.quadraticCurveTo(22 + armSwing * 0.4, shoulderY + 18, 17 + armSwing, hipY + 10);
  ctx.stroke();
  ctx.strokeStyle = '#b35b38';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(11, shoulderY + 5);
  ctx.quadraticCurveTo(22 + armSwing * 0.4, shoulderY + 18, 17 + armSwing, hipY + 10);
  ctx.stroke();
  // 后手
  ctx.fillStyle = skinDark;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.arc(17 + armSwing, hipY + 11, 6, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 身体（连帽衫）
  const bodyGrad = ctx.createLinearGradient(-24, shoulderY, 24, hipY);
  bodyGrad.addColorStop(0, hoodieLight);
  bodyGrad.addColorStop(0.45, hoodie);
  bodyGrad.addColorStop(1, hoodieDark);
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-22, shoulderY + 3);
  ctx.bezierCurveTo(-31, shoulderY + 24, -28, hipY - 10, -20, hipY + 2);
  ctx.lineTo(-16, hipY + 11);
  ctx.lineTo(-10, hipY + 4);
  ctx.lineTo(-4, hipY + 13);
  ctx.lineTo(2, hipY + 5);
  ctx.lineTo(8, hipY + 14);
  ctx.lineTo(13, hipY + 5);
  ctx.lineTo(20, hipY + 6);
  ctx.bezierCurveTo(29, hipY - 15, 27, shoulderY + 22, 16, shoulderY + 3);
  ctx.quadraticCurveTo(0, shoulderY - 4, -22, shoulderY + 3);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 帽兜
  ctx.fillStyle = hoodieDark;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(12, shoulderY + 2, 12, 8, -0.2, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 衣服细节
  ctx.strokeStyle = 'rgba(70,30,16,.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, shoulderY + 8);
  ctx.lineTo(1, hipY + 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,190,130,.35)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-18, shoulderY + 12);
  ctx.quadraticCurveTo(-24, shoulderY + 34, -19, hipY - 4);
  ctx.stroke();
  // 口袋
  ctx.strokeStyle = 'rgba(80,34,19,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-13, hipY - 8);
  ctx.lineTo(12, hipY - 8);
  ctx.stroke();
  // 胸口的脑子贴布
  ctx.fillStyle = '#ff9fba';
  ctx.strokeStyle = '#6e2f44';
  ctx.lineWidth = 1.6;
  const patchY = shoulderY + 17;
  ctx.beginPath();
  ctx.ellipse(-8, patchY, 6.5, 5, -0.2, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.arc(-10, patchY - 2, 3, 0, TAU);
  ctx.arc(-5, patchY - 2, 3, 0, TAU);
  ctx.fillStyle = '#ffb7c9';
  ctx.fill();
  ctx.strokeStyle = '#8e4a5c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-11, patchY + 3); ctx.lineTo(-9, patchY + 5);
  ctx.moveTo(-6, patchY + 3); ctx.lineTo(-4, patchY + 5);
  ctx.stroke();

  // 围巾
  ctx.fillStyle = scarf;
  ctx.strokeStyle = '#6a4b1b';
  ctx.lineWidth = 2;
  roundPath(-20, shoulderY - 2, 38, 9, 4);
  ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.translate(14, shoulderY + 1);
  ctx.rotate(0.3 + Math.sin(t * 5 + 1) * 0.18 + walk * 0.08);
  fillRound(0, -2, 24, 7, 3, '#d7a43b');
  ctx.strokeStyle = '#6a4b1b';
  ctx.lineWidth = 1.6;
  roundPath(0, -2, 24, 7, 3);
  ctx.stroke();
  ctx.restore();

  // 前手臂
  ctx.strokeStyle = hoodie;
  ctx.lineWidth = 12;
  const frontShoulderX = -10;
  if (bite) {
    ctx.beginPath();
    ctx.moveTo(frontShoulderX, shoulderY + 5);
    ctx.quadraticCurveTo(-31, shoulderY + 13, -43 - chomp * 2, shoulderY + 5);
    ctx.stroke();
    ctx.strokeStyle = skin;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-29, shoulderY + 12);
    ctx.lineTo(-45 - chomp * 2, shoulderY + 4);
    ctx.stroke();
    // 手
    ctx.fillStyle = skin;
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(-46 - chomp * 2, shoulderY + 4, 6, 0, TAU);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = skinDark;
    ctx.lineWidth = 1.8;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-48 - chomp * 2, shoulderY + 1 + i * 3);
      ctx.lineTo(-53 - chomp * 2, shoulderY - 1 + i * 3);
      ctx.stroke();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(frontShoulderX, shoulderY + 5);
    ctx.quadraticCurveTo(-22 - armSwing * 0.5, shoulderY + 20, -24 - armSwing, hipY + 12);
    ctx.stroke();
    ctx.strokeStyle = '#b65a38';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-18, shoulderY + 14);
    ctx.lineTo(-24 - armSwing, hipY + 12);
    ctx.stroke();
    ctx.fillStyle = skin;
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(-24 - armSwing, hipY + 13, 6.2, 0, TAU);
    ctx.fill(); ctx.stroke();
    // 手指
    ctx.strokeStyle = skinDark;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-27 - armSwing, hipY + 10);
    ctx.lineTo(-31 - armSwing, hipY + 7);
    ctx.moveTo(-26 - armSwing, hipY + 14);
    ctx.lineTo(-30 - armSwing, hipY + 14);
    ctx.stroke();
  }

  // 脖子
  ctx.fillStyle = skinDark;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(-1, shoulderY - 2, 9, 8, 0, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 头
  ctx.save();
  ctx.translate(-7, headY);
  ctx.rotate(-0.07 + (bite ? -0.05 : 0) + Math.sin(t * 1.7) * 0.018);

  // 后脑头发
  ctx.fillStyle = '#263b2b';
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(12, -22);
  ctx.quadraticCurveTo(29, -16, 24, -2);
  ctx.quadraticCurveTo(30, 8, 17, 13);
  ctx.quadraticCurveTo(12, 2, 12, -22);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 头骨
  const headGrad = ctx.createLinearGradient(-headR, -headR, headR, headR);
  headGrad.addColorStop(0, skinLight);
  headGrad.addColorStop(0.6, skin);
  headGrad.addColorStop(1, skinDark);
  ctx.fillStyle = headGrad;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(0, 0, headR, headR + 2, 0.02, 0, TAU);
  ctx.fill(); ctx.stroke();

  // 耳朵
  ctx.fillStyle = skin;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 2.8;
  ctx.beginPath();
  ctx.ellipse(13 + duck * 2, 2, 5.5, 8, 0.2, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = skinDark;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(13 + duck * 2, 2, 2.4, -0.8, 1.8);
  ctx.stroke();

  // 头发尖
  ctx.fillStyle = '#263b2b';
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-15, -23);
  ctx.quadraticCurveTo(-21, -36, -9, -33);
  ctx.quadraticCurveTo(-7, -44, 2, -34);
  ctx.quadraticCurveTo(8, -43, 11, -30);
  ctx.quadraticCurveTo(20, -34, 16, -22);
  ctx.quadraticCurveTo(2, -27, -15, -23);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 绷带
  ctx.save();
  ctx.translate(4, -17);
  ctx.rotate(-0.28);
  ctx.fillStyle = '#e7d7b1';
  ctx.strokeStyle = '#8c7958';
  ctx.lineWidth = 1;
  ctx.fillRect(-8, -3, 18, 6);
  ctx.strokeRect(-8, -3, 18, 6);
  ctx.fillStyle = '#b6a27c';
  circle(-4, 0, 1, '#b6a27c');
  circle(4, 0, 1, '#b6a27c');
  ctx.restore();

  // 大眼睛
  ctx.fillStyle = EYE_WHITE;
  ctx.strokeStyle = '#1a2a1c';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.ellipse(-15, -4, 8.2, 10, -0.04, 0, TAU);
  ctx.fill(); ctx.stroke();
  if (dead) {
    ctx.strokeStyle = '#24352a';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-19, -8); ctx.lineTo(-11, 0);
    ctx.moveTo(-11, -8); ctx.lineTo(-19, 0);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#1d3b28';
    ctx.beginPath();
    ctx.arc(-17 + look * 0.4, -3, 4.1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#8fd05f';
    ctx.beginPath();
    ctx.arc(-17 + look * 0.4, -3, 2.4, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#142116';
    ctx.beginPath();
    ctx.arc(-17 + look * 0.4, -3, 1.3, 0, TAU);
    ctx.fill();
    circle(-18.5 + look * 0.4, -4.5, 1.2, '#fff');
    // 眼皮
    ctx.fillStyle = skin;
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(-15, -9, 8.4, 4, -0.04, Math.PI, TAU);
    ctx.fill();
  }
  // 另一只小眼
  if (!dead) {
    ctx.strokeStyle = '#1a2a1c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(1, -4);
    ctx.quadraticCurveTo(5, -6, 8, -4);
    ctx.stroke();
  }

  // 鼻子
  ctx.fillStyle = skinDark;
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(-29, 6, 6, 5, 0.1, 0, TAU);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(50,76,37,.6)';
  circle(-31, 6, 1.3, 'rgba(50,76,37,.6)');

  // 嘴
  ctx.strokeStyle = '#24321f';
  ctx.lineWidth = 2;
  if (bite) {
    const open = 3 + chomp * 7;
    ctx.fillStyle = '#2a1715';
    ctx.beginPath();
    ctx.ellipse(-18, 17, 9.5, open, 0.06, 0, TAU);
    ctx.fill(); ctx.stroke();
    // 牙
    ctx.fillStyle = '#f3efcf';
    ctx.fillRect(-24, 14 - open * 0.3, 4, 4);
    ctx.fillRect(-18, 14 - open * 0.3, 4, 4);
    ctx.fillRect(-12, 14 - open * 0.3, 3.5, 3.5);
    ctx.fillStyle = '#cf6b6b';
    ctx.beginPath();
    ctx.ellipse(-18, 20, 5, 2.4 + chomp * 2, 0, 0, TAU);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-26, 15);
    ctx.quadraticCurveTo(-18, 19, -9, 14);
    ctx.stroke();
    ctx.fillStyle = '#f3efcf';
    ctx.fillRect(-21, 14, 3.5, 3.5);
    ctx.fillRect(-15, 15, 3.5, 3);
  }

  // 腮红 / 缝合线
  ctx.fillStyle = 'rgba(220,112,92,.16)';
  ctx.beginPath();
  ctx.ellipse(7, 11, 5, 3.4, 0.1, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#416132';
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(0 + i * 4, 18);
    ctx.lineTo(2 + i * 4, 23);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-1 + i * 4, 20.5);
    ctx.lineTo(3 + i * 4, 20.5);
    ctx.stroke();
  }

  // 小呆毛
  ctx.strokeStyle = '#263b2b';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-5, -30);
  ctx.quadraticCurveTo(-7, -38, -1, -36);
  ctx.stroke();

  ctx.restore(); // head

  ctx.filter = 'none';
  ctx.restore(); // player

  // 冰冻光环
  if (p.slowT > 0 && !dead) {
    ctx.save();
    ctx.globalAlpha = clamp(p.slowT / CONFIG.player.slowDuration, 0, 1) * 0.8;
    ctx.strokeStyle = 'rgba(139,232,255,.55)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) {
      const a = t * 0.9 + i * TAU / 5;
      const x = p.x + Math.cos(a) * (26 + i * 3);
      const y = GROUND - 40 - Math.sin(a * 1.4) * 30;
      ctx.beginPath();
      for (let j = 0; j < 3; j++) {
        const aa = a + j * TAU / 3;
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(aa) * 3.5, y + Math.sin(aa) * 3.5);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ============================================================
   绘制：子弹 / 粒子 / 前景
   ============================================================ */
function drawBullets(t) {
  for (const b of G.bullets) {
    const type = b.type;
    if (type === 'frost') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(b.x - 5, b.y, 1, b.x - 5, b.y, 16);
      g.addColorStop(0, 'rgba(200,250,255,.75)');
      g.addColorStop(1, 'rgba(139,232,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(b.x - 22, b.y - 16, 40, 32);
      ctx.restore();
      // 尾迹
      ctx.strokeStyle = 'rgba(155,236,255,.4)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x - 22, b.y);
      ctx.lineTo(b.x - 7, b.y);
      ctx.stroke();
      // 冰晶
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(t * 5 + b.wobble);
      ctx.fillStyle = '#c8f8ff';
      ctx.strokeStyle = '#3e8a9c';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(5, -2); ctx.lineTo(8, 0); ctx.lineTo(5, 3); ctx.lineTo(0, 8); ctx.lineTo(-5, 3); ctx.lineTo(-8, 0); ctx.lineTo(-5, -2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      circle(-2, -2, 1.8, 'rgba(255,255,255,.85)');
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(b.x - 5, b.y, 1, b.x - 5, b.y, 15);
      g.addColorStop(0, 'rgba(220,255,150,.65)');
      g.addColorStop(1, 'rgba(185,243,107,0)');
      ctx.fillStyle = g;
      ctx.fillRect(b.x - 22, b.y - 15, 40, 30);
      ctx.restore();
      ctx.strokeStyle = 'rgba(185,243,107,.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x - 22, b.y);
      ctx.lineTo(b.x - 7, b.y);
      ctx.stroke();
      // 豆子
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.sin(t * 9 + b.wobble) * 0.2);
      ctx.fillStyle = '#a9e66e';
      ctx.strokeStyle = '#315f2d';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 8, 6.5, 0.2, 0, TAU);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(240,255,183,.85)';
      ctx.beginPath();
      ctx.ellipse(-2.5, -2, 2.8, 2, 0.3, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.kind === 'spark') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = Math.max(1, p.size * 0.55);
      ctx.beginPath();
      ctx.moveTo(-p.vx * 0.02, -p.vy * 0.02);
      ctx.lineTo(p.vx * 0.02, p.vy * 0.02);
      ctx.stroke();
    } else if (p.kind === 'shard') {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
    } else if (p.kind === 'heart') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(0, p.size * 0.6);
      ctx.bezierCurveTo(-p.size * 1.4, -p.size * 0.2, -p.size * 0.7, -p.size, 0, -p.size * 0.3);
      ctx.bezierCurveTo(p.size * 0.7, -p.size, p.size * 1.4, -p.size * 0.2, 0, p.size * 0.6);
      ctx.fill();
    } else if (p.kind === 'brain') {
      ctx.fillStyle = p.color;
      ctx.strokeStyle = 'rgba(95,34,50,.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(-p.size * 0.35, 0, p.size * 0.6, 0, TAU);
      ctx.arc(p.size * 0.35, 0, p.size * 0.6, 0, TAU);
      ctx.fill(); ctx.stroke();
    } else if (p.kind === 'dust') {
      ctx.globalAlpha *= 0.55;
      circle(0, 0, p.size, p.color);
    } else {
      circle(0, 0, p.size, p.color);
    }
    ctx.restore();
  }
}

function drawTexts() {
  for (const t of G.texts) {
    const a = clamp(t.life / t.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 ${t.size}px "Microsoft YaHei", "PingFang SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(6,15,10,.75)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

function drawAmbient(t) {
  const th = G.level ? G.level.theme : CONFIG.levels[0].theme;
  ctx.save();
  for (const a of G.ambient) {
    if (th.ambient === 'firefly') {
      const flicker = 0.4 + Math.abs(Math.sin(t * 1.8 + a.drift)) * 0.6;
      ctx.globalAlpha = 0.5 * flicker;
      const g = ctx.createRadialGradient(a.x, a.y, 1, a.x, a.y, 11 * a.z);
      g.addColorStop(0, 'rgba(236,255,168,.9)');
      g.addColorStop(1, 'rgba(185,243,107,0)');
      ctx.fillStyle = g;
      ctx.fillRect(a.x - 14, a.y - 14, 28, 28);
      ctx.globalAlpha = 0.9 * flicker;
      circle(a.x, a.y, 1.7 * a.z, '#e6ffa8');
    } else if (th.ambient === 'snow') {
      ctx.globalAlpha = 0.28 + a.z * 0.35;
      circle(a.x, a.y, a.size * 0.9, '#dff8ff');
    } else {
      ctx.globalAlpha = 0.35 + a.z * 0.3;
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.fillStyle = a.z > 0.9 ? '#b96d3f' : '#8c5834';
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.5 * a.z, 2.2 * a.z, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawVignette(t) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.44, H * 0.18, W * 0.5, H * 0.44, W * 0.68);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.72, 'rgba(0,4,3,.18)');
  g.addColorStop(1, 'rgba(0,3,2,.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 顶部夜色
  const top = ctx.createLinearGradient(0, 0, 0, 88);
  top.addColorStop(0, 'rgba(0,4,4,.42)');
  top.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, W, 88);

  // 低血量时画面边缘微红
  if (G.player && G.state === 'playing' && G.player.hp > 0 && G.player.hp <= CONFIG.player.lowHp) {
    const pulse = 0.08 + Math.abs(Math.sin(t * 3.2)) * 0.1;
    const red = ctx.createRadialGradient(W * 0.5, H * 0.45, H * 0.25, W * 0.5, H * 0.45, W * 0.68);
    red.addColorStop(0, 'rgba(255,55,40,0)');
    red.addColorStop(1, `rgba(255,45,32,${pulse})`);
    ctx.fillStyle = red;
    ctx.fillRect(0, 0, W, H);
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!G.level) return;
  const t = G.time;
  const th = G.level.theme;
  G.shakeX = (Math.random() * 2 - 1) * G.shake;
  G.shakeY = (Math.random() * 2 - 1) * G.shake * 0.7;

  drawSky(t, th);
  drawHills(th);
  drawBackHouses(th);
  drawFence(th);
  drawGround(t, th);

  // 世界层
  ctx.save();
  ctx.translate(-G.camX + G.shakeX, G.shakeY);
  drawHouse(t, G.level);
  drawWindupBeams(t);
  for (const pl of G.plants) drawPlant(pl, t);
  drawPlayerTrail(t);
  drawZombie(t);
  drawBullets(t);
  // 掩体画在角色前面，站在掩体后时会挡住僵尸下半身
  for (const cov of G.covers) drawCover(cov, t);
  drawParticles();
  drawTexts();
  ctx.restore();

  drawAmbient(t);
  drawVignette(t);
}

/* ============================================================
   启动
   ============================================================ */
function boot() {
  loadMute();
  applyMuteUI();
  buildDashPips();
  loadLevel(0, 'title');
  G.state = 'title';
  el.pauseBtn.disabled = true;
  renderTitle();
  updateHUD(true);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

window.addEventListener('error', (e) => {
  try {
    showToast('运行出错：' + (e.message || '未知错误'), 'bad');
  } catch (err) {}
});

boot();

</script>
